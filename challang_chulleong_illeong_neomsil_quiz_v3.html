
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="엄마의 말공부 공통 퀴즈 템플릿">
  <title>찰랑찰랑·출렁출렁·일렁일렁·넘실넘실 퀴즈 | 엄마의 말공부</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;
      background:#f8f9fd;
      color:#333;
    }
    .wrap{
      width:min(720px,100%);
      margin:0 auto;
      padding:22px 15px 45px;
    }
    .hero{
      padding:27px 18px;
      margin-bottom:20px;
      text-align:center;
      background:linear-gradient(135deg,#e9eaf8,#fce9ed);
      border-radius:24px;
      box-shadow:0 7px 20px rgba(0,0,0,.08);
    }
    .hero h1{
      margin:0 0 10px;
      font-size:26px;
      line-height:1.45;
    }
    .hero p{
      margin:0;
      font-size:17px;
      line-height:1.6;
    }
    .progress{
      position:sticky;
      top:8px;
      z-index:10;
      margin-bottom:16px;
      padding:12px 16px;
      text-align:center;
      color:#fff;
      background:#525b72;
      border-radius:15px;
      font-size:17px;
      font-weight:700;
      box-shadow:0 5px 15px rgba(0,0,0,.15);
    }
    .question{
      margin-bottom:16px;
      padding:20px;
      background:#fff;
      border-radius:20px;
      box-shadow:0 5px 16px rgba(0,0,0,.07);
    }
    .question h2{
      margin:0 0 14px;
      font-size:20px;
      line-height:1.55;
    }
    .choices{
      display:grid;
      gap:10px;
    }
    .choice{
      width:100%;
      padding:14px 15px;
      border:2px solid #e1e4ec;
      border-radius:14px;
      background:#fcfdff;
      text-align:left;
      font-size:18px;
      cursor:pointer;
      transition:.15s;
    }
    .choice:hover:not(:disabled){
      background:#f0f2f8;
      transform:translateY(-1px);
    }
    .choice:disabled{cursor:default}
    .choice.correct{
      border-color:#5dbb7a;
      background:#def7e6;
      color:#176536;
      font-weight:700;
    }
    .choice.wrong{
      border-color:#e07373;
      background:#ffe3e3;
      color:#982626;
      font-weight:700;
    }
    .result{
      min-height:25px;
      margin-top:12px;
      font-size:17px;
      font-weight:700;
      line-height:1.5;
    }
    .explain{
      display:none;
      margin-top:8px;
      padding:11px 13px;
      background:#fff8df;
      border-radius:11px;
      font-size:16px;
      line-height:1.55;
    }
    .final-message{
      display:none;
      margin-top:20px;
      padding:22px;
      background:#fff0f4;
      border-radius:20px;
      text-align:center;
      font-size:19px;
      font-weight:700;
      line-height:1.75;
      box-shadow:0 5px 16px rgba(0,0,0,.06);
    }
    .final-score{
      display:block;
      margin:5px 0 8px;
      font-size:31px;
    }
    .buttons{
      display:none;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin:18px 0 0;
    }
    .action-btn{
      padding:14px 12px;
      border:0;
      border-radius:14px;
      font-size:17px;
      font-weight:700;
      cursor:pointer;
    }
    .reset{
      background:#75809a;
      color:#fff;
    }
    .random{
      background:#e8edf8;
      color:#3f4960;
    }
    .summary{
      margin-top:24px;
      padding:21px;
      background:#f1f2f9;
      border-radius:20px;
      font-size:17px;
      line-height:1.9;
    }
    .summary h3{
      margin:0 0 9px;
      font-size:21px;
    }
    @media(max-width:430px){
      .hero h1{font-size:22px}
      .question h2{font-size:19px}
      .choice{font-size:17px}
      .buttons{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1 id="quizTitle">📖 엄마의 말공부 퀴즈</h1>
      <p id="quizSubtitle">알맞은 말을 골라 보세요!</p>
    </section>

    <div class="progress">
      맞힌 문제 <span id="score">0</span>개 ·
      푼 문제 <span id="done">0</span>/<span id="total">0</span>
    </div>

    <div id="quiz"></div>

    <div id="finalMessage" class="final-message"></div>

    <div id="buttons" class="buttons">
      <button class="action-btn reset" onclick="restartOriginal()">🔄 다시 풀기</button>
      <button class="action-btn random" onclick="restartRandom()">🎲 랜덤으로 풀기</button>
    </div>

    <section class="summary">
      <h3>🌱 한 번에 정리해요</h3>
      <div id="summaryContent"></div>
    </section>
  </main>

  <script>
    /*
      ================================
      1. 아래 QUIZ_CONFIG만 바꾸면 됩니다.
      ================================
    */

    const QUIZ_CONFIG = {
  "title": "📖 찰랑찰랑·출렁출렁·일렁일렁·넘실넘실",
  "subtitle": "비슷해 보여도 움직임의 크기와 느낌이 달라요. 12문제로 익혀 보세요!",
  "summary": [
    {
      "emoji": "💧",
      "word": "찰랑찰랑",

    },
    {
      "emoji": "🌊",
      "word": "출렁출렁",
      "meaning": "물이나 물체가 비교적 크고 힘 있게 오르내리며 흔들리는 느낌"
    },
    {

      "word": "일렁일렁",
      "meaning": "물결·빛·불꽃 등이 잔잔하게 계속 흔들리는 느낌"
    },
    {
      "emoji": "🌾",
      "word": "넘실넘실",
      "meaning": "넓고 큰 움직임이 부드럽고 풍성하게 이어지는 느낌"
    }
  ],
  "questions": [
    {
      "q": "물이 잔잔하게 움직이며 가볍고 맑은 소리가 나는 모습에 가장 잘 어울리는 말은?",
      "choices": [
        "출렁출렁",
        "찰랑찰랑",
        "일렁일렁",
        "넘실넘실"
      ],
      "answer": 1,
      "explanation": "'찰랑찰랑'은 물결이 가볍게 흔들리며 맑은 소리를 내는 느낌에 잘 어울려요."
    },
    {
      "q": "햇빛을 받은 호수 표면에 빛과 물결이 잔잔하게 흔들려 보여요. 가장 알맞은 말은?",
      "choices": [
        "출렁출렁",
        "찰랑찰랑",
        "넘실넘실",
        "일렁일렁"
      ],
      "answer": 3,
      "explanation": "'일렁일렁'은 물결이나 빛, 불꽃 등이 잔잔하게 계속 흔들리는 모습을 나타내요."
    },
    {
      "q": "사람들이 배 한쪽으로 움직이자 배가 크게 위아래로 흔들렸어요. 가장 알맞은 말은?",
      "choices": [
        "출렁출렁",
        "넘실넘실",
        "찰랑찰랑",
        "일렁일렁"
      ],
      "answer": 0,
      "explanation": "'출렁출렁'은 물이나 물체가 비교적 크고 힘 있게 오르내리며 흔들리는 모습을 나타내요."
    },
    {
      "q": "넓은 바다에 큰 물결이 부드럽게 이어지며 밀려옵니다. 가장 알맞은 말은?",
      "choices": [
        "일렁일렁",
        "찰랑찰랑",
        "넘실넘실",
        "출렁출렁"
      ],
      "answer": 2,
      "explanation": "'넘실넘실'은 넓은 곳에서 큰 물결이 부드럽고 풍성하게 계속 움직이는 느낌에 잘 어울려요."
    },
    {
      "q": "수영장에서 친구가 힘껏 뛰어들자 물이 크게 흔들렸어요. 가장 알맞은 말은?",
      "choices": [
        "출렁출렁",
        "일렁일렁",
        "넘실넘실",
        "찰랑찰랑"
      ],
      "answer": 0,
      "explanation": "큰 움직임 때문에 물이 크게 오르내릴 때는 '출렁출렁'이 잘 어울려요."
    },
    {
      "q": "아이가 물이 든 컵을 들고 걸으니 물이 컵 가장자리에서 가볍게 흔들려요. 가장 알맞은 말은?",
      "choices": [
        "출렁출렁",
        "일렁일렁",
        "넘실넘실",
        "찰랑찰랑"
      ],
      "answer": 3,
      "explanation": "작은 그릇 속 물이 가볍게 흔들리는 장면에는 '찰랑찰랑'이 자연스러워요."
    },
    {
      "q": "바람이 불자 넓은 들판의 황금빛 벼가 물결처럼 부드럽게 이어져 움직여요. 가장 알맞은 말은?",
      "choices": [
        "출렁출렁",
        "일렁일렁",
        "넘실넘실",
        "찰랑찰랑"
      ],
      "answer": 2,
      "explanation": "'넘실넘실'은 바다뿐 아니라 넓은 들판처럼 큰 움직임이 이어지는 모습에도 잘 어울려요."
    },
    {
      "q": "촛불이 바람을 받아 꺼지지는 않고 계속 살짝 흔들립니다. 가장 알맞은 말은?",
      "choices": [
        "찰랑찰랑",
        "일렁일렁",
        "넘실넘실",
        "출렁출렁"
      ],
      "answer": 1,
      "explanation": "'일렁일렁'은 물결뿐 아니라 빛이나 불꽃이 흔들리는 모습에도 쓸 수 있어요."
    },
    {
      "q": "'넘실넘실'에 가장 가까운 느낌은 무엇일까요?",
      "choices": [
        "작고 빠르게 튀는 움직임",
        "한곳에서 가만히 떨리는 모습",
        "딱딱한 물체가 부딪히는 모습",
        "넓고 큰 움직임이 부드럽게 이어지는 모습"
      ],
      "answer": 3,
      "explanation": "'넘실넘실'은 넓고 풍성한 움직임이 부드럽게 이어지는 느낌을 나타내요."
    },
    {
      "q": "다음 중 '출렁출렁'의 느낌을 가장 잘 설명한 것은?",
      "choices": [
        "크고 힘 있게 오르내리며 흔들리는 느낌",
        "빛이 잔잔하게 흔들리는 느낌",
        "작은 물결이 맑은 소리를 내는 느낌",
        "넓은 물결이 부드럽게 이어지는 느낌"
      ],
      "answer": 0,
      "explanation": "'출렁출렁'의 핵심은 비교적 크고 힘 있는 흔들림이에요."
    },
    {
      "q": "다음 중 물이 아닌 것에도 자연스럽게 쓸 수 있는 '일렁일렁'의 예는?",
      "choices": [
        "돌멩이가 굴러가는 모습",
        "불빛이 흔들리는 모습",
        "책장이 넘어가는 모습",
        "문이 세게 닫히는 모습"
      ],
      "answer": 1,
      "explanation": "'일렁일렁'은 물결 외에도 불꽃이나 빛이 흔들리는 모습을 표현할 수 있어요."
    },
    {
      "q": "다음 중 '찰랑찰랑'과 가장 잘 어울리는 장면은?",
      "choices": [
        "거센 파도가 방파제를 세게 치는 모습",
        "촛불이 살짝 흔들리는 모습",
        "컵 속 물이 가볍게 흔들리는 모습",
        "넓은 바다의 큰 물결이 이어지는 모습"
      ],
      "answer": 2,
      "explanation": "'찰랑찰랑'은 컵이나 대야처럼 비교적 작은 곳의 물이 가볍게 흔들리는 느낌을 잘 살려요."
    }
  ]
};

    /*
      ================================
      2. 아래 코드는 수정하지 않아도 됩니다.
      ================================
    */

    const originalQuestions = deepCopy(QUIZ_CONFIG.questions);
    let currentQuestions = deepCopy(originalQuestions);
    let score = 0;
    let done = 0;
    let answered = [];

    function deepCopy(data){
      return JSON.parse(JSON.stringify(data));
    }

    function shuffle(array){
      for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
      }
      return array;
    }

    function initPage(){
      document.getElementById("quizTitle").textContent = QUIZ_CONFIG.title;
      document.getElementById("quizSubtitle").textContent = QUIZ_CONFIG.subtitle;
      document.getElementById("total").textContent = originalQuestions.length;

      const summaryBox = document.getElementById("summaryContent");
      summaryBox.innerHTML = QUIZ_CONFIG.summary.map(item =>
        `${item.emoji} <b>${item.word}</b> : ${item.meaning}`
      ).join("<br>");

      renderQuiz();
    }

    function renderQuiz(){
      score=0;
      done=0;
      answered=Array(currentQuestions.length).fill(false);

      document.getElementById("score").textContent="0";
      document.getElementById("done").textContent="0";
      document.getElementById("total").textContent=currentQuestions.length;
      document.getElementById("finalMessage").style.display="none";
      document.getElementById("buttons").style.display="none";

      const quiz=document.getElementById("quiz");
      quiz.innerHTML="";

      currentQuestions.forEach((item,qi)=>{
        const section=document.createElement("section");
        section.className="question";

        const title=document.createElement("h2");
        title.textContent=`${qi+1}. ${item.q}`;
        section.appendChild(title);

        const choices=document.createElement("div");
        choices.className="choices";

        item.choices.forEach((text,ci)=>{
          const button=document.createElement("button");
          button.className="choice";
          button.textContent=`${ci+1}. ${text}`;
          button.addEventListener("click",()=>checkAnswer(qi,ci,button,section));
          choices.appendChild(button);
        });

        const result=document.createElement("div");
        result.className="result";

        const explain=document.createElement("div");
        explain.className="explain";

        section.appendChild(choices);
        section.appendChild(result);
        section.appendChild(explain);
        quiz.appendChild(section);
      });
    }

    function checkAnswer(qi,ci,selected,section){
      if(answered[qi]) return;

      answered[qi]=true;
      done++;

      const item=currentQuestions[qi];
      const buttons=section.querySelectorAll(".choice");
      const result=section.querySelector(".result");
      const explain=section.querySelector(".explain");

      buttons.forEach((button,index)=>{
        button.disabled=true;
        if(index===item.answer) button.classList.add("correct");
      });

      if(ci===item.answer){
        score++;
        result.textContent="⭕ 정답이에요!";
      }else{
        selected.classList.add("wrong");
        result.textContent=`❌ 정답은 ‘${item.choices[item.answer]}’이에요.`;
      }

      explain.textContent=`💡 ${item.explanation}`;
      explain.style.display="block";

      document.getElementById("score").textContent=score;
      document.getElementById("done").textContent=done;

      if(done===currentQuestions.length){
        showFinalMessage();
      }
    }

    function showFinalMessage(){
      const box=document.getElementById("finalMessage");
      const total=currentQuestions.length;
      const ratio=score/total;
      let message="";

      if(score===total){
        message=`🏆 결과<span class="final-score">${score} / ${total}</span>🎉 말 박사네요! 모두 정확히 알고 있어요.`;
      }else if(ratio>=0.8){
        message=`🏆 결과<span class="final-score">${score} / ${total}</span>👏 정말 잘했어요! 조금만 더 하면 만점이에요.`;
      }else if(ratio>=0.55){
        message=`🏆 결과<span class="final-score">${score} / ${total}</span>🌟 잘했어요! 헷갈린 문제만 다시 살펴보세요.`;
      }else{
        message=`🏆 결과<span class="final-score">${score} / ${total}</span>🌱 다시 도전하면 더 잘할 수 있어요!`;
      }

      box.innerHTML=message;
      box.style.display="block";
      document.getElementById("buttons").style.display="grid";
      box.scrollIntoView({behavior:"smooth",block:"center"});
    }

    function restartOriginal(){
      currentQuestions=deepCopy(originalQuestions);
      renderQuiz();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    function restartRandom(){
      currentQuestions=shuffle(deepCopy(originalQuestions));

      currentQuestions.forEach(item=>{
        const correctText=item.choices[item.answer];
        item.choices=shuffle([...item.choices]);
        item.answer=item.choices.indexOf(correctText);
      });

      renderQuiz();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    initPage();
  </script>
</body>
</html>
