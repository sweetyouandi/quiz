
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>매끈매끈·미끌미끌·끈적끈적·까슬까슬 퀴즈</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;background:#f8fbf9;color:#333}
    .wrap{width:min(720px,100%);margin:0 auto;padding:22px 15px 45px}
    .hero{padding:27px 18px;margin-bottom:20px;text-align:center;background:linear-gradient(135deg,#e5f2ed,#f3e9ff);border-radius:24px;box-shadow:0 7px 20px rgba(0,0,0,.08)}
    .hero h1{margin:0 0 10px;font-size:25px;line-height:1.45}
    .hero p{margin:0;font-size:17px;line-height:1.6}
    .progress{position:sticky;top:8px;z-index:10;margin-bottom:16px;padding:12px 16px;text-align:center;color:#fff;background:#4f6259;border-radius:15px;font-size:17px;font-weight:700;box-shadow:0 5px 15px rgba(0,0,0,.15)}
    .question{margin-bottom:16px;padding:20px;background:#fff;border-radius:20px;box-shadow:0 5px 16px rgba(0,0,0,.07)}
    .question h2{margin:0 0 14px;font-size:20px;line-height:1.55}
    .choices{display:grid;gap:10px}
    .choice{width:100%;padding:14px 15px;border:2px solid #dfe8e3;border-radius:14px;background:#fcfffd;text-align:left;font-size:18px;cursor:pointer;transition:.15s}
    .choice:hover:not(:disabled){background:#eff7f3;transform:translateY(-1px)}
    .choice:disabled{cursor:default}
    .choice.correct{border-color:#5dbb7a;background:#def7e6;color:#176536;font-weight:700}
    .choice.wrong{border-color:#e07373;background:#ffe3e3;color:#982626;font-weight:700}
    .result{min-height:25px;margin-top:12px;font-size:17px;font-weight:700;line-height:1.5}
    .explain{display:none;margin-top:8px;padding:11px 13px;background:#fff8df;border-radius:11px;font-size:16px;line-height:1.55}
    .summary{margin-top:24px;padding:21px;background:#eef7f2;border-radius:20px;font-size:17px;line-height:1.9}
    .summary h3{margin:0 0 9px;font-size:21px}
    .final-message{display:none;margin-top:18px;padding:18px;background:#fff0f4;border-radius:18px;text-align:center;font-size:19px;font-weight:700;line-height:1.6}
    .reset{display:block;margin:24px auto 0;padding:13px 24px;border:0;border-radius:14px;background:#6e8b7c;color:white;font-size:17px;font-weight:700;cursor:pointer}
    @media(max-width:430px){.hero h1{font-size:21px}.question h2{font-size:19px}.choice{font-size:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>✨ 매끈매끈·미끌미끌<br>끈적끈적·까슬까슬</h1>
      <p>만졌을 때의 느낌을 떠올리며 알맞은 말을 골라 보세요!</p>
    </section>

    <div class="progress">
      맞힌 문제 <span id="score">0</span>개 · 푼 문제 <span id="done">0</span>/12
    </div>

    <div id="quiz"></div>
    <div id="finalMessage" class="final-message"></div>

    <section class="summary">
      <h3>🌱 한 번에 정리해요</h3>
      ✨ <b>매끈매끈</b> : 표면이 고르고 윤이 나며 부드러운 느낌<br>
      🧼 <b>미끌미끌</b> : 물기나 기름기 때문에 자꾸 미끄러지는 느낌<br>
      🍯 <b>끈적끈적</b> : 손이나 물건에 달라붙고 잘 떨어지지 않는 느낌<br>
      🧶 <b>까슬까슬</b> : 표면이 거칠고 피부에 거슬리는 느낌
    </section>

    <button class="reset" onclick="resetQuiz()">처음부터 다시 풀기</button>
  </main>

  <script>
    const questions = [{"q": "비누가 묻은 손으로 컵을 잡으니 자꾸 미끄러졌어요.", "choices": ["매끈매끈", "끈적끈적", "미끌미끌", "까슬까슬"], "answer": 2, "explanation": "표면에 물기나 기름기가 있어 자꾸 미끄러지는 느낌은 ‘미끌미끌’이에요."}, {"q": "거친 수세미를 만지니 손끝에 거친 느낌이 났어요.", "choices": ["까슬까슬", "매끈매끈", "미끌미끌", "끈적끈적"], "answer": 0, "explanation": "표면이 거칠고 잔가시처럼 느껴지는 촉감은 ‘까슬까슬’이에요."}, {"q": "새 유리컵의 겉면을 만지니 울퉁불퉁한 곳 없이 부드러웠어요.", "choices": ["미끌미끌", "끈적끈적", "까슬까슬", "매끈매끈"], "answer": 3, "explanation": "표면이 고르고 윤이 나며 부드러운 느낌은 ‘매끈매끈’이에요."}, {"q": "꿀이 손가락에 묻자 손가락끼리 달라붙었어요.", "choices": ["매끈매끈", "끈적끈적", "미끌미끌", "까슬까슬"], "answer": 1, "explanation": "무언가에 달라붙고 잘 떨어지지 않는 느낌은 ‘끈적끈적’이에요."}, {"q": "대리석 바닥은 표면이 고르고 반짝였어요.", "choices": ["끈적끈적", "까슬까슬", "미끌미끌", "매끈매끈"], "answer": 3, "explanation": "고르고 반짝이며 부드러운 표면은 ‘매끈매끈’이라고 해요."}, {"q": "엿을 만졌더니 손바닥에 달라붙었어요.", "choices": ["끈적끈적", "까슬까슬", "매끈매끈", "미끌미끌"], "answer": 0, "explanation": "엿이나 시럽처럼 손에 달라붙는 느낌은 ‘끈적끈적’이에요."}, {"q": "기름이 묻은 접시를 잡으니 손에서 자꾸 빠질 것 같았어요.", "choices": ["끈적끈적", "미끌미끌", "매끈매끈", "까슬까슬"], "answer": 1, "explanation": "기름기 때문에 손에서 잘 미끄러지는 느낌은 ‘미끌미끌’이에요."}, {"q": "새로 산 니트의 목 부분이 피부에 닿자 조금 거슬렸어요.", "choices": ["미끌미끌", "끈적끈적", "까슬까슬", "매끈매끈"], "answer": 2, "explanation": "천이나 털이 거칠게 닿아 피부가 불편한 느낌은 ‘까슬까슬’이에요."}, {"q": "스티커를 떼어 낸 자리에는 접착제가 남아 손에 달라붙었어요.", "choices": ["끈적끈적", "미끌미끌", "까슬까슬", "매끈매끈"], "answer": 0, "explanation": "접착제처럼 손에 달라붙는 느낌은 ‘끈적끈적’이에요."}, {"q": "모래가 묻은 종이를 문지르니 표면이 거칠게 느껴졌어요.", "choices": ["끈적끈적", "매끈매끈", "까슬까슬", "미끌미끌"], "answer": 2, "explanation": "잔모래처럼 표면이 거칠고 까칠한 느낌은 ‘까슬까슬’이에요."}, {"q": "잘 닦은 책상 위를 손바닥으로 쓸어 보니 고르고 부드러웠어요.", "choices": ["까슬까슬", "미끌미끌", "끈적끈적", "매끈매끈"], "answer": 3, "explanation": "거친 곳 없이 고르고 부드러운 표면은 ‘매끈매끈’이에요."}, {"q": "욕실 바닥에 물이 묻어 발이 자꾸 미끄러졌어요.", "choices": ["까슬까슬", "미끌미끌", "끈적끈적", "매끈매끈"], "answer": 1, "explanation": "물기 때문에 발이 미끄러지는 상태는 ‘미끌미끌’이에요."}];
    let score = 0;
    let done = 0;
    const answered = Array(questions.length).fill(false);

    function renderQuiz(){
      const quiz=document.getElementById("quiz");
      quiz.innerHTML="";

      questions.forEach((item,qi)=>{
        const section=document.createElement("section");
        section.className="question";

        const title=document.createElement("h2");
        title.textContent=`${qi+1}. ${item.q}`;
        section.appendChild(title);

        const choices=document.createElement("div");
        choices.className="choices";

        item.choices.forEach((text,ci)=>{
          const button=document.createElement("button");
          button.className="choice";
          button.textContent=`${ci+1}. ${text}`;
          button.addEventListener("click",()=>checkAnswer(qi,ci,button,section));
          choices.appendChild(button);
        });

        const result=document.createElement("div");
        result.className="result";
        const explain=document.createElement("div");
        explain.className="explain";

        section.appendChild(choices);
        section.appendChild(result);
        section.appendChild(explain);
        quiz.appendChild(section);
      });
    }

    function checkAnswer(qi,ci,selected,section){
      if(answered[qi]) return;

      answered[qi]=true;
      done++;

      const item=questions[qi];
      const buttons=section.querySelectorAll(".choice");
      const result=section.querySelector(".result");
      const explain=section.querySelector(".explain");

      buttons.forEach((button,index)=>{
        button.disabled=true;
        if(index===item.answer) button.classList.add("correct");
      });

      if(ci===item.answer){
        score++;
        result.textContent="⭕ 정답이에요!";
      }else{
        selected.classList.add("wrong");
        result.textContent=`❌ 정답은 ‘${item.choices[item.answer]}’이에요.`;
      }

      explain.textContent=`💡 ${item.explanation}`;
      explain.style.display="block";

      document.getElementById("score").textContent=score;
      document.getElementById("done").textContent=done;

      if(done===questions.length) showFinalMessage();
    }

    function showFinalMessage(){
      const box=document.getElementById("finalMessage");

      if(score===12){
        box.textContent="🎉 12문제를 모두 맞혔어요! 네 가지 촉감의 차이를 정확히 알고 있네요.";
      }else if(score>=9){
        box.textContent=`👏 ${score}문제를 맞혔어요! 헷갈린 문제만 다시 살펴보세요.`;
      }else{
        box.textContent=`🌱 ${score}문제를 맞혔어요. 아래 정리를 읽고 다시 도전해 보세요!`;
      }

      box.style.display="block";
      box.scrollIntoView({behavior:"smooth",block:"center"});
    }

    function resetQuiz(){
      score=0;
      done=0;
      answered.fill(false);

      document.getElementById("score").textContent="0";
      document.getElementById("done").textContent="0";
      document.getElementById("finalMessage").style.display="none";

      renderQuiz();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    renderQuiz();
  </script>
</body>
</html>
