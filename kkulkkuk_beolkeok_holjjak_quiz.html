<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{font-family:sans-serif;max-width:700px;margin:auto;padding:20px}button{display:block;width:100%;margin:6px 0;padding:10px}.c{background:#cfc}.w{background:#fcc}</style></head><body><h2>꿀꺽꿀꺽·벌컥벌컥·홀짝홀짝</h2><div id='q'></div><script>const d=[{"q": "민이가 약을 먹고 물을 여러 번 삼켰어요.", "choices": ["꿀꺽꿀꺽", "벌컥벌컥", "홀짝홀짝"], "answer": 0, "exp": "목으로 연달아 삼키는 모습"}, {"q": "운동 후 아빠가 생수를 급하게 마셨어요.", "choices": ["꿀꺽꿀꺽", "벌컥벌컥", "홀짝홀짝"], "answer": 1, "exp": "많은 양을 급하게 마시는 모습"}, {"q": "엄마가 따뜻한 차를 조금씩 마셨어요.", "choices": ["꿀꺽꿀꺽", "벌컥벌컥", "홀짝홀짝"], "answer": 2, "exp": "한 모금씩 천천히 마시는 모습"}, {"q": "강아지가 물을 목으로 계속 넘겼어요.", "choices": ["꿀꺽꿀꺽", "벌컥벌컥", "홀짝홀짝"], "answer": 0, "exp": "계속 삼키는 모습"}, {"q": "더운 날 물병을 단숨에 비웠어요.", "choices": ["꿀꺽꿀꺽", "벌컥벌컥", "홀짝홀짝"], "answer": 1, "exp": "급하게 들이켜는 모습"}, {"q": "주스를 빨대로 조금씩 마셨어요.", "choices": ["꿀꺽꿀꺽", "벌컥벌컥", "홀짝홀짝"], "answer": 2, "exp": "조금씩 마시는 모습"}],r=document.getElementById('q');let s=0;d.forEach((x,i)=>{let e=document.createElement('div');e.innerHTML='<h3>'+(i+1)+'. '+x.q+'</h3>';x.choices.forEach((t,j)=>{let b=document.createElement('button');b.textContent=(j+1)+'. '+t;b.onclick=()=>{e.querySelectorAll('button').forEach((k,n)=>{k.disabled=true;if(n==x.answer)k.className='c'});if(j!=x.answer)b.className='w';let p=document.createElement('p');p.textContent='💡 '+x.exp;e.appendChild(p);};e.appendChild(b);});r.appendChild(e);});</script></body></html>
