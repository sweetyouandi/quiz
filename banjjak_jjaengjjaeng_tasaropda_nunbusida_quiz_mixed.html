
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반짝반짝·쨍쨍·따사롭다·눈부시다 퀴즈</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;background:#fffaf0;color:#333}
    .wrap{width:min(720px,100%);margin:0 auto;padding:22px 15px 45px}
    .hero{padding:27px 18px;margin-bottom:20px;text-align:center;background:linear-gradient(135deg,#fff0b9,#ffe7cf);border-radius:24px;box-shadow:0 7px 20px rgba(0,0,0,.08)}
    .hero h1{margin:0 0 10px;font-size:25px;line-height:1.45}
    .hero p{margin:0;font-size:17px;line-height:1.6}
    .progress{position:sticky;top:8px;z-index:10;margin-bottom:16px;padding:12px 16px;text-align:center;color:#fff;background:#7a622b;border-radius:15px;font-size:17px;font-weight:700;box-shadow:0 5px 15px rgba(0,0,0,.15)}
    .question{margin-bottom:16px;padding:20px;background:#fff;border-radius:20px;box-shadow:0 5px 16px rgba(0,0,0,.07)}
    .question h2{margin:0 0 14px;font-size:20px;line-height:1.55}
    .choices{display:grid;gap:10px}
    .choice{width:100%;padding:14px 15px;border:2px solid #ece3cf;border-radius:14px;background:#fffefd;text-align:left;font-size:18px;cursor:pointer;transition:.15s}
    .choice:hover:not(:disabled){background:#fff8e8;transform:translateY(-1px)}
    .choice:disabled{cursor:default}
    .choice.correct{border-color:#5dbb7a;background:#def7e6;color:#176536;font-weight:700}
    .choice.wrong{border-color:#e07373;background:#ffe3e3;color:#982626;font-weight:700}
    .result{min-height:25px;margin-top:12px;font-size:17px;font-weight:700;line-height:1.5}
    .explain{display:none;margin-top:8px;padding:11px 13px;background:#fff7dc;border-radius:11px;font-size:16px;line-height:1.55}
    .summary{margin-top:24px;padding:21px;background:#fff3d8;border-radius:20px;font-size:17px;line-height:1.9}
    .summary h3{margin:0 0 9px;font-size:21px}
    .final-message{display:none;margin-top:18px;padding:18px;background:#fff0f4;border-radius:18px;text-align:center;font-size:19px;font-weight:700;line-height:1.6}
    .reset{display:block;margin:24px auto 0;padding:13px 24px;border:0;border-radius:14px;background:#c99b37;color:white;font-size:17px;font-weight:700;cursor:pointer}
    @media(max-width:430px){.hero h1{font-size:21px}.question h2{font-size:19px}.choice{font-size:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>☀️ 반짝반짝·쨍쨍<br>따사롭다·눈부시다</h1>
      <p>빛과 햇살의 모습을 떠올리며 알맞은 말을 골라 보세요!</p>
    </section>

    <div class="progress">
      맞힌 문제 <span id="score">0</span>개 · 푼 문제 <span id="done">0</span>/12
    </div>

    <div id="quiz"></div>
    <div id="finalMessage" class="final-message"></div>

    <section class="summary">
      <h3>🌱 한 번에 정리해요</h3>
      ✨ <b>반짝반짝</b> : 작은 빛이 잇따라 빛났다 어두워지는 모습<br>
      ☀️ <b>쨍쨍</b> : 햇볕이 매우 강하고 뜨겁게 내리쬐는 모습<br>
      🌤️ <b>따사롭다</b> : 햇살이나 날씨가 부드럽고 따뜻한 느낌<br>
      😎 <b>눈부시다</b> : 빛이 너무 밝고 강해 눈을 뜨기 어려운 상태
    </section>

    <button class="reset" onclick="resetQuiz()">처음부터 다시 풀기</button>
  </main>

  <script>
    const questions = [{"q": "한여름 낮, 구름 한 점 없이 햇볕이 아주 강하게 내리쬐었어요.", "choices": ["반짝반짝", "따사롭다", "쨍쨍", "눈부시다"], "answer": 2, "explanation": "햇볕이 매우 강하고 뜨겁게 내리쬐는 모습은 ‘쨍쨍’이에요."}, {"q": "밤하늘의 별들이 작고 밝은 빛을 계속 내고 있었어요.", "choices": ["반짝반짝", "쨍쨍", "따사롭다", "눈부시다"], "answer": 0, "explanation": "작은 빛이 잇따라 빛났다 어두워지는 모습은 ‘반짝반짝’이에요."}, {"q": "눈밭에 햇빛이 비치자 너무 밝아서 눈을 제대로 뜰 수 없었어요.", "choices": ["반짝반짝", "쨍쨍", "따사롭다", "눈부시다"], "answer": 3, "explanation": "빛이 너무 밝고 강해 눈을 뜨기 어려울 때는 ‘눈부시다’라고 해요."}, {"q": "봄날 창가에 앉으니 부드럽고 따뜻한 햇살이 몸을 감쌌어요.", "choices": ["반짝반짝", "따사롭다", "쨍쨍", "눈부시다"], "answer": 1, "explanation": "햇살이나 날씨가 부드럽고 따뜻하게 느껴질 때는 ‘따사롭다’가 알맞아요."}, {"q": "깨끗이 닦은 보석이 빛을 받아 여기저기서 빛났어요.", "choices": ["따사롭다", "눈부시다", "쨍쨍", "반짝반짝"], "answer": 3, "explanation": "보석이나 물결이 작은 빛을 계속 내는 모습은 ‘반짝반짝’이에요."}, {"q": "겨울이 지나고 포근한 햇살이 얼굴에 부드럽게 닿았어요.", "choices": ["따사롭다", "쨍쨍", "눈부시다", "반짝반짝"], "answer": 0, "explanation": "포근하고 부드러운 따뜻함이 느껴지는 햇살은 ‘따사롭다’고 해요."}, {"q": "햇볕이 강하게 내리쬐어 운동장 바닥이 뜨거워졌어요.", "choices": ["눈부시다", "쨍쨍", "반짝반짝", "따사롭다"], "answer": 1, "explanation": "맑은 날 강한 햇볕이 뜨겁게 비치는 모습은 ‘쨍쨍’이에요."}, {"q": "무대 조명이 갑자기 켜지자 너무 밝아 민이는 눈을 가렸어요.", "choices": ["따사롭다", "반짝반짝", "눈부시다", "쨍쨍"], "answer": 2, "explanation": "강한 빛 때문에 눈을 가리고 싶을 정도라면 ‘눈부시다’가 알맞아요."}, {"q": "가을 오후의 햇살이 따뜻하고 부드러워 산책하기 좋았어요.", "choices": ["따사롭다", "눈부시다", "반짝반짝", "쨍쨍"], "answer": 0, "explanation": "기분 좋게 따뜻하고 부드러운 햇살은 ‘따사롭다’예요."}, {"q": "아침 해가 자동차 유리에 반사되어 너무 밝게 비쳤어요.", "choices": ["쨍쨍", "따사롭다", "눈부시다", "반짝반짝"], "answer": 2, "explanation": "반사된 빛이 너무 강해 눈을 뜨기 힘든 상태는 ‘눈부시다’예요."}, {"q": "햇빛을 받은 바닷물이 작은 빛을 수없이 내며 흔들렸어요.", "choices": ["눈부시다", "따사롭다", "쨍쨍", "반짝반짝"], "answer": 3, "explanation": "물결 위에서 작은 빛이 잇따라 빛나는 모습은 ‘반짝반짝’이에요."}, {"q": "비가 그친 뒤 한낮의 해가 아주 강하게 내리쬐었어요.", "choices": ["따사롭다", "쨍쨍", "눈부시다", "반짝반짝"], "answer": 1, "explanation": "한낮의 햇볕이 강렬하게 내리쬐는 모습은 ‘쨍쨍’이에요."}];
    let score = 0;
    let done = 0;
    const answered = Array(questions.length).fill(false);

    function renderQuiz(){
      const quiz=document.getElementById("quiz");
      quiz.innerHTML="";

      questions.forEach((item,qi)=>{
        const section=document.createElement("section");
        section.className="question";

        const title=document.createElement("h2");
        title.textContent=`${qi+1}. ${item.q}`;
        section.appendChild(title);

        const choices=document.createElement("div");
        choices.className="choices";

        item.choices.forEach((text,ci)=>{
          const button=document.createElement("button");
          button.className="choice";
          button.textContent=`${ci+1}. ${text}`;
          button.addEventListener("click",()=>checkAnswer(qi,ci,button,section));
          choices.appendChild(button);
        });

        const result=document.createElement("div");
        result.className="result";

        const explain=document.createElement("div");
        explain.className="explain";

        section.appendChild(choices);
        section.appendChild(result);
        section.appendChild(explain);
        quiz.appendChild(section);
      });
    }

    function checkAnswer(qi,ci,selected,section){
      if(answered[qi]) return;

      answered[qi]=true;
      done++;

      const item=questions[qi];
      const buttons=section.querySelectorAll(".choice");
      const result=section.querySelector(".result");
      const explain=section.querySelector(".explain");

      buttons.forEach((button,index)=>{
        button.disabled=true;
        if(index===item.answer) button.classList.add("correct");
      });

      if(ci===item.answer){
        score++;
        result.textContent="⭕ 정답이에요!";
      }else{
        selected.classList.add("wrong");
        result.textContent=`❌ 정답은 ‘${item.choices[item.answer]}’예요.`;
      }

      explain.textContent=`💡 ${item.explanation}`;
      explain.style.display="block";

      document.getElementById("score").textContent=score;
      document.getElementById("done").textContent=done;

      if(done===questions.length) showFinalMessage();
    }

    function showFinalMessage(){
      const box=document.getElementById("finalMessage");

      if(score===12){
        box.textContent="🎉 12문제를 모두 맞혔어요! 네 가지 빛과 햇살의 차이를 정확히 알고 있네요.";
      }else if(score>=9){
        box.textContent=`👏 ${score}문제를 맞혔어요! 헷갈린 문제만 다시 살펴보세요.`;
      }else{
        box.textContent=`🌱 ${score}문제를 맞혔어요. 아래 정리를 읽고 다시 도전해 보세요!`;
      }

      box.style.display="block";
      box.scrollIntoView({behavior:"smooth",block:"center"});
    }

    function resetQuiz(){
      score=0;
      done=0;
      answered.fill(false);

      document.getElementById("score").textContent="0";
      document.getElementById("done").textContent="0";
      document.getElementById("finalMessage").style.display="none";

      renderQuiz();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    renderQuiz();
  </script>
</body>
</html>
