
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바스락바스락·부스럭부스럭·사각사각·아삭아삭 퀴즈</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;background:#fffaf4;color:#333}
    .wrap{width:min(720px,100%);margin:0 auto;padding:22px 15px 45px}
    .hero{padding:27px 18px;margin-bottom:20px;text-align:center;background:linear-gradient(135deg,#f3eadf,#e7f5df);border-radius:24px;box-shadow:0 7px 20px rgba(0,0,0,.08)}
    .hero h1{margin:0 0 10px;font-size:25px;line-height:1.45}
    .hero p{margin:0;font-size:17px;line-height:1.6}
    .progress{position:sticky;top:8px;z-index:10;margin-bottom:16px;padding:12px 16px;text-align:center;color:#fff;background:#5b5148;border-radius:15px;font-size:17px;font-weight:700;box-shadow:0 5px 15px rgba(0,0,0,.15)}
    .question{margin-bottom:16px;padding:20px;background:#fff;border-radius:20px;box-shadow:0 5px 16px rgba(0,0,0,.07)}
    .question h2{margin:0 0 14px;font-size:20px;line-height:1.55}
    .choices{display:grid;gap:10px}
    .choice{width:100%;padding:14px 15px;border:2px solid #e6ded5;border-radius:14px;background:#fffdfb;text-align:left;font-size:18px;cursor:pointer;transition:.15s}
    .choice:hover:not(:disabled){background:#f8f2ec;transform:translateY(-1px)}
    .choice:disabled{cursor:default}
    .choice.correct{border-color:#5dbb7a;background:#def7e6;color:#176536;font-weight:700}
    .choice.wrong{border-color:#e07373;background:#ffe3e3;color:#982626;font-weight:700}
    .result{min-height:25px;margin-top:12px;font-size:17px;font-weight:700;line-height:1.5}
    .explain{display:none;margin-top:8px;padding:11px 13px;background:#fff8df;border-radius:11px;font-size:16px;line-height:1.55}
    .summary{margin-top:24px;padding:21px;background:#f3f7ed;border-radius:20px;font-size:17px;line-height:1.9}
    .summary h3{margin:0 0 9px;font-size:21px}
    .final-message{display:none;margin-top:18px;padding:18px;background:#fff0f4;border-radius:18px;text-align:center;font-size:19px;font-weight:700;line-height:1.6}
    .reset{display:block;margin:24px auto 0;padding:13px 24px;border:0;border-radius:14px;background:#8a715c;color:white;font-size:17px;font-weight:700;cursor:pointer}
    @media(max-width:430px){.hero h1{font-size:21px}.question h2{font-size:19px}.choice{font-size:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>🍂 바스락바스락·부스럭부스럭<br>사각사각·아삭아삭</h1>
      <p>소리가 나는 물건과 상황을 떠올리며 알맞은 말을 골라 보세요!</p>
    </section>

    <div class="progress">
      맞힌 문제 <span id="score">0</span>개 · 푼 문제 <span id="done">0</span>/12
    </div>

    <div id="quiz"></div>
    <div id="finalMessage" class="final-message"></div>

    <section class="summary">
      <h3>🌱 한 번에 정리해요</h3>
      🍂 <b>바스락바스락</b> : 마른 종이나 나뭇잎이 가볍게 스치는 소리<br>
      🎒 <b>부스럭부스럭</b> : 가방이나 상자 속 물건을 뒤지며 나는 어수선한 소리<br>
      ✏️ <b>사각사각</b> : 연필이나 칼이 표면을 가볍게 긁거나 스치는 소리<br>
      🍎 <b>아삭아삭</b> : 싱싱하고 단단한 과일이나 채소를 씹는 소리
    </section>

    <button class="reset" onclick="resetQuiz()">처음부터 다시 풀기</button>
  </main>

  <script>
    const questions = [{"q": "마른 나뭇잎을 밟으니 가볍고 마른 소리가 났어요.", "choices": ["바스락바스락", "부스럭부스럭", "사각사각", "아삭아삭"], "answer": 0, "explanation": "마른 종이나 나뭇잎이 가볍게 스치며 나는 소리는 ‘바스락바스락’이에요."}, {"q": "가방 속을 뒤지자 종이와 물건들이 뒤섞여 소리를 냈어요.", "choices": ["바스락바스락", "부스럭부스럭", "사각사각", "아삭아삭"], "answer": 1, "explanation": "가방이나 상자 속을 뒤지며 물건들이 어수선하게 움직이는 소리는 ‘부스럭부스럭’이에요."}, {"q": "연필로 종이에 글씨를 쓰니 가볍게 긁히는 소리가 났어요.", "choices": ["바스락바스락", "부스럭부스럭", "사각사각", "아삭아삭"], "answer": 2, "explanation": "연필이나 칼처럼 단단한 것이 표면을 가볍게 긁거나 써 내려가는 소리는 ‘사각사각’이에요."}, {"q": "민이가 사과를 한입 베어 물자 상쾌한 소리가 났어요.", "choices": ["바스락바스락", "부스럭부스럭", "사각사각", "아삭아삭"], "answer": 3, "explanation": "싱싱하고 단단한 채소나 과일을 씹을 때 나는 소리는 ‘아삭아삭’이에요."}, {"q": "포장지를 손으로 만지자 얇은 종이가 가볍게 스쳤어요.", "choices": ["바스락바스락", "사각사각", "아삭아삭", "부스럭부스럭"], "answer": 0, "explanation": "얇고 마른 종이가 스치는 소리는 ‘바스락바스락’이 잘 어울려요."}, {"q": "고양이가 상자 안에서 몸을 움직이자 안의 물건들이 흔들렸어요.", "choices": ["사각사각", "부스럭부스럭", "바스락바스락", "아삭아삭"], "answer": 1, "explanation": "여러 물건이 뒤섞여 어수선하게 움직이는 소리는 ‘부스럭부스럭’이에요."}, {"q": "엄마가 칼로 무를 얇게 썰자 도마에서 가벼운 소리가 났어요.", "choices": ["아삭아삭", "바스락바스락", "사각사각", "부스럭부스럭"], "answer": 2, "explanation": "칼이 단단한 재료나 도마를 가볍게 베고 스치는 소리는 ‘사각사각’이에요."}, {"q": "오이를 씹으니 싱싱하고 경쾌한 소리가 났어요.", "choices": ["부스럭부스럭", "사각사각", "바스락바스락", "아삭아삭"], "answer": 3, "explanation": "오이나 사과처럼 싱싱한 것을 씹는 소리는 ‘아삭아삭’이에요."}, {"q": "마른 풀잎이 바람에 서로 스치며 소리를 냈어요.", "choices": ["바스락바스락", "아삭아삭", "부스럭부스럭", "사각사각"], "answer": 0, "explanation": "마른 풀이나 잎이 가볍게 스치는 소리는 ‘바스락바스락’이에요."}, {"q": "서랍 속을 찾느라 물건을 이리저리 움직였어요.", "choices": ["아삭아삭", "부스럭부스럭", "사각사각", "바스락바스락"], "answer": 1, "explanation": "서랍이나 가방 속 물건을 뒤지며 나는 소리는 ‘부스럭부스럭’이에요."}, {"q": "민이가 색연필로 종이를 빠르게 칠했어요.", "choices": ["부스럭부스럭", "아삭아삭", "사각사각", "바스락바스락"], "answer": 2, "explanation": "연필이나 색연필이 종이를 긁으며 나는 소리는 ‘사각사각’이에요."}, {"q": "깍두기를 씹자 단단하고 시원한 소리가 났어요.", "choices": ["사각사각", "바스락바스락", "부스럭부스럭", "아삭아삭"], "answer": 3, "explanation": "단단하고 싱싱한 채소를 씹을 때는 ‘아삭아삭’이라고 해요."}];
    let score = 0;
    let done = 0;
    const answered = Array(questions.length).fill(false);

    function renderQuiz(){
      const quiz=document.getElementById("quiz");
      quiz.innerHTML="";
      questions.forEach((item,qi)=>{
        const section=document.createElement("section");
        section.className="question";

        const title=document.createElement("h2");
        title.textContent=`${qi+1}. ${item.q}`;
        section.appendChild(title);

        const choices=document.createElement("div");
        choices.className="choices";

        item.choices.forEach((text,ci)=>{
          const button=document.createElement("button");
          button.className="choice";
          button.textContent=`${ci+1}. ${text}`;
          button.addEventListener("click",()=>checkAnswer(qi,ci,button,section));
          choices.appendChild(button);
        });

        const result=document.createElement("div");
        result.className="result";
        const explain=document.createElement("div");
        explain.className="explain";

        section.appendChild(choices);
        section.appendChild(result);
        section.appendChild(explain);
        quiz.appendChild(section);
      });
    }

    function checkAnswer(qi,ci,selected,section){
      if(answered[qi]) return;
      answered[qi]=true;
      done++;

      const item=questions[qi];
      const buttons=section.querySelectorAll(".choice");
      const result=section.querySelector(".result");
      const explain=section.querySelector(".explain");

      buttons.forEach((button,index)=>{
        button.disabled=true;
        if(index===item.answer) button.classList.add("correct");
      });

      if(ci===item.answer){
        score++;
        result.textContent="⭕ 정답이에요!";
      }else{
        selected.classList.add("wrong");
        result.textContent=`❌ 정답은 ‘${item.choices[item.answer]}’이에요.`;
      }

      explain.textContent=`💡 ${item.explanation}`;
      explain.style.display="block";
      document.getElementById("score").textContent=score;
      document.getElementById("done").textContent=done;

      if(done===questions.length) showFinalMessage();
    }

    function showFinalMessage(){
      const box=document.getElementById("finalMessage");
      if(score===12){
        box.textContent="🎉 12문제를 모두 맞혔어요! 네 가지 소리의 차이를 정확히 알고 있네요.";
      }else if(score>=9){
        box.textContent=`👏 ${score}문제를 맞혔어요! 헷갈린 문제만 다시 살펴보세요.`;
      }else{
        box.textContent=`🌱 ${score}문제를 맞혔어요. 아래 정리를 읽고 다시 도전해 보세요!`;
      }
      box.style.display="block";
      box.scrollIntoView({behavior:"smooth",block:"center"});
    }

    function resetQuiz(){
      score=0;
      done=0;
      answered.fill(false);
      document.getElementById("score").textContent="0";
      document.getElementById("done").textContent="0";
      document.getElementById("finalMessage").style.display="none";
      renderQuiz();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    renderQuiz();
  </script>
</body>
</html>
