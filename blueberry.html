
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="블루베리의 하얀 블룸, 작은 관목, 파란색, 왕관 모양 꽃받침을 12문제로 재미있게 확인해 보세요.">
  <title>블루베리 퀴즈 12문제 | 아이의 1분 상식</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;
      background:#f8f9fd;
      color:#333;
    }
    .wrap{
      width:min(720px,100%);
      margin:0 auto;
      padding:22px 15px 45px;
    }
    .hero{
      padding:27px 18px;
      margin-bottom:20px;
      text-align:center;
      background:linear-gradient(135deg,#e9eaf8,#fce9ed);
      border-radius:24px;
      box-shadow:0 7px 20px rgba(0,0,0,.08);
    }
    .hero h1{
      margin:0 0 10px;
      font-size:26px;
      line-height:1.45;
    }
    .hero p{
      margin:0;
      font-size:17px;
      line-height:1.6;
    }
    .progress{
      position:sticky;
      top:8px;
      z-index:10;
      margin-bottom:16px;
      padding:12px 16px;
      text-align:center;
      color:#fff;
      background:#525b72;
      border-radius:15px;
      font-size:17px;
      font-weight:700;
      box-shadow:0 5px 15px rgba(0,0,0,.15);
    }
    .question{
      margin-bottom:16px;
      padding:20px;
      background:#fff;
      border-radius:20px;
      box-shadow:0 5px 16px rgba(0,0,0,.07);
    }
    .question h2{
      margin:0 0 14px;
      font-size:20px;
      line-height:1.55;
    }
    .choices{
      display:grid;
      gap:10px;
    }
    .choice{
      width:100%;
      padding:14px 15px;
      border:2px solid #e1e4ec;
      border-radius:14px;
      background:#fcfdff;
      text-align:left;
      font-size:18px;
      cursor:pointer;
      transition:.15s;
    }
    .choice:hover:not(:disabled){
      background:#f0f2f8;
      transform:translateY(-1px);
    }
    .choice:disabled{cursor:default}
    .choice.correct{
      border-color:#5dbb7a;
      background:#def7e6;
      color:#176536;
      font-weight:700;
    }
    .choice.wrong{
      border-color:#e07373;
      background:#ffe3e3;
      color:#982626;
      font-weight:700;
    }
    .result{
      min-height:25px;
      margin-top:12px;
      font-size:17px;
      font-weight:700;
      line-height:1.5;
    }
    .explain{
      display:none;
      margin-top:8px;
      padding:11px 13px;
      background:#fff8df;
      border-radius:11px;
      font-size:16px;
      line-height:1.55;
    }
    .final-message{
      display:none;
      margin-top:20px;
      padding:22px;
      background:#fff0f4;
      border-radius:20px;
      text-align:center;
      font-size:19px;
      font-weight:700;
      line-height:1.75;
      box-shadow:0 5px 16px rgba(0,0,0,.06);
    }
    .final-score{
      display:block;
      margin:5px 0 8px;
      font-size:31px;
    }
    .buttons{
      display:none;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin:18px 0 0;
    }
    .action-btn{
      padding:14px 12px;
      border:0;
      border-radius:14px;
      font-size:17px;
      font-weight:700;
      cursor:pointer;
    }
    .reset{
      background:#75809a;
      color:#fff;
    }
    .random{
      background:#e8edf8;
      color:#3f4960;
    }
    .summary{
      margin-top:24px;
      padding:21px;
      background:#f1f2f9;
      border-radius:20px;
      font-size:17px;
      line-height:1.9;
    }
    .summary h3{
      margin:0 0 9px;
      font-size:21px;
    }
    @media(max-width:430px){
      .hero h1{font-size:22px}
      .question h2{font-size:19px}
      .choice{font-size:17px}
      .buttons{grid-template-columns:1fr}
    }
  </style>

  <meta property="og:type" content="website">
  <meta property="og:title" content="블루베리 퀴즈 12문제 | 아이의 1분 상식">
  <meta property="og:description" content="블루베리의 하얀 블룸, 작은 관목, 파란색, 왕관 모양 꽃받침을 12문제로 재미있게 확인해 보세요.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="블루베리 퀴즈 12문제 | 아이의 1분 상식">
  <meta name="twitter:description" content="블루베리의 하얀 블룸, 작은 관목, 파란색, 왕관 모양 꽃받침을 12문제로 재미있게 확인해 보세요.">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1 id="quizTitle">📖 엄마의 말공부 퀴즈</h1>
      <p id="quizSubtitle">알맞은 말을 골라 보세요!</p>
    </section>

    <div class="progress">
      맞힌 문제 <span id="score">0</span>개 ·
      푼 문제 <span id="done">0</span>/<span id="total">0</span>
    </div>

    <div id="quiz"></div>

    <div id="finalMessage" class="final-message"></div>

    <div id="buttons" class="buttons">
      <button class="action-btn reset" onclick="restartOriginal()">🔄 다시 풀기</button>
      <button class="action-btn random" onclick="restartRandom()">🎲 랜덤으로 풀기</button>
    </div>

    <section class="summary">
      <h3>🌱 한 번에 정리해요</h3>
      <div id="summaryContent"></div>
    </section>
  </main>

  <script>
    /*
      ================================
      1. 아래 QUIZ_CONFIG만 바꾸면 됩니다.
      ================================
    */

    const QUIZ_CONFIG = {
  "title": "📖 블루베리 퀴즈",
  "subtitle": "블루베리의 색, 블룸, 나무, 작은 왕관을 알아볼까요?",
  "summary": [
    {
      "emoji": "🫐",
      "word": "블룸",
      "meaning": "블루베리 겉에 생기는 하얀 보호막"
    },
    {
      "emoji": "🌿",
      "word": "관목",
      "meaning": "큰 나무보다 낮고 여러 줄기로 자라는 나무"
    },
    {
      "emoji": "💙",
      "word": "안토시아닌",
      "meaning": "블루베리의 파란빛과 보랏빛에 관계하는 색소"
    },
    {
      "emoji": "👑",
      "word": "작은 왕관",
      "meaning": "꽃이 피었을 때의 꽃받침이 남은 흔적"
    }
  ],
  "questions": [
    {
      "q": "블루베리 껍질에 하얗게 보이는 가루 같은 것은 무엇일까요?",
      "choices": [
        "설탕가루",
        "블룸",
        "밀가루"
      ],
      "answer": 1,
      "explanation": "블루베리 겉의 하얀 가루는 ‘블룸’이라고 불러요."
    },
    {
      "q": "블루베리 겉의 블룸은 어떤 일을 할까요?",
      "choices": [
        "열매를 보호해요",
        "열매를 크게 만들어요",
        "씨앗을 없애요"
      ],
      "answer": 0,
      "explanation": "블룸은 수분이 쉽게 날아가지 않도록 돕고 열매 표면을 보호해요."
    },
    {
      "q": "블루베리의 블룸을 세게 문지르면 어떻게 될까요?",
      "choices": [
        "더 달아져요",
        "색이 노랗게 변해요",
        "겉의 보호막이 벗겨질 수 있어요"
      ],
      "answer": 2,
      "explanation": "블룸은 자연스럽게 생긴 보호막이라 세게 문지르면 지워질 수 있어요."
    },
    {
      "q": "블루베리는 보통 어떤 식물에서 열릴까요?",
      "choices": [
        "키가 작은 관목",
        "아주 큰 야자나무",
        "물속의 풀"
      ],
      "answer": 0,
      "explanation": "블루베리는 큰 나무가 아니라 키가 비교적 작은 관목에서 열려요."
    },
    {
      "q": "블루베리 나무가 크게 자라지 않는 까닭으로 알맞은 것은?",
      "choices": [
        "열매가 너무 무거워서",
        "원래 관목의 특징을 가진 식물이어서",
        "햇빛을 싫어해서"
      ],
      "answer": 1,
      "explanation": "블루베리는 원래 여러 줄기가 낮게 자라는 관목의 특징을 가진 식물이에요."
    },
    {
      "q": "다음 중 블루베리가 자라는 모습으로 알맞지 않은 것은?",
      "choices": [
        "낮은 가지에 열매가 달려요",
        "여러 줄기가 퍼져 자라요",
        "야자수 꼭대기에 열려요"
      ],
      "answer": 2,
      "explanation": "블루베리는 야자수처럼 큰 나무 꼭대기에서 열리는 열매가 아니에요."
    },
    {
      "q": "블루베리의 파란색과 보라색을 만드는 데 관계있는 색소는 무엇일까요?",
      "choices": [
        "엽록소",
        "카로틴",
        "안토시아닌"
      ],
      "answer": 2,
      "explanation": "블루베리의 파란빛과 보랏빛에는 안토시아닌 색소가 관계해요."
    },
    {
      "q": "블루베리가 익어 가며 색이 진해지는 까닭은 무엇일까요?",
      "choices": [
        "파란 물을 먹어서",
        "안토시아닌 색소가 늘어나서",
        "껍질에 잉크가 묻어서"
      ],
      "answer": 1,
      "explanation": "열매가 익어 가면서 안토시아닌 색소가 많아져 색이 짙어져요."
    },
    {
      "q": "블루베리는 겉으로 어떤 색 계열로 보일까요?",
      "choices": [
        "파란색과 보라색 계열",
        "주황색 계열",
        "하얀색 계열"
      ],
      "answer": 0,
      "explanation": "블루베리는 안토시아닌과 겉의 블룸 때문에 파란색이나 보라색 계열로 보여요."
    },
    {
      "q": "블루베리 끝에 왕관처럼 보이는 부분은 무엇의 흔적일까요?",
      "choices": [
        "뿌리",
        "꽃받침",
        "씨앗"
      ],
      "answer": 1,
      "explanation": "왕관처럼 보이는 부분은 꽃이 피었을 때의 꽃받침이 남은 흔적이에요."
    },
    {
      "q": "블루베리의 작은 왕관은 열매의 어느 쪽에서 볼 수 있을까요?",
      "choices": [
        "뿌리 쪽",
        "껍질 속",
        "꽃이 달렸던 끝부분"
      ],
      "answer": 2,
      "explanation": "작은 왕관은 꽃이 달렸던 열매 끝부분에 남아 있어요."
    },
    {
      "q": "다음 중 블루베리의 특징을 바르게 묶은 것은?",
      "choices": [
        "블룸이 있고 꽃받침 흔적이 남아 있어요",
        "큰 나무에서 열리고 껍질이 노래요",
        "물속에서 자라고 씨앗이 없어요"
      ],
      "answer": 0,
      "explanation": "블루베리는 겉에 블룸이 있고, 끝에는 꽃받침 흔적이 왕관처럼 남아 있어요."
    }
  ]
};

    /*
      ================================
      2. 아래 코드는 수정하지 않아도 됩니다.
      ================================
    */

    const originalQuestions = deepCopy(QUIZ_CONFIG.questions);
    let currentQuestions = deepCopy(originalQuestions);
    let score = 0;
    let done = 0;
    let answered = [];

    function deepCopy(data){
      return JSON.parse(JSON.stringify(data));
    }

    function shuffle(array){
      for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
      }
      return array;
    }

    function initPage(){
      document.getElementById("quizTitle").textContent = QUIZ_CONFIG.title;
      document.getElementById("quizSubtitle").textContent = QUIZ_CONFIG.subtitle;
      document.getElementById("total").textContent = originalQuestions.length;

      const summaryBox = document.getElementById("summaryContent");
      summaryBox.innerHTML = QUIZ_CONFIG.summary.map(item =>
        `${item.emoji} <b>${item.word}</b> : ${item.meaning}`
      ).join("<br>");

      renderQuiz();
    }

    function renderQuiz(){
      score=0;
      done=0;
      answered=Array(currentQuestions.length).fill(false);

      document.getElementById("score").textContent="0";
      document.getElementById("done").textContent="0";
      document.getElementById("total").textContent=currentQuestions.length;
      document.getElementById("finalMessage").style.display="none";
      document.getElementById("buttons").style.display="none";

      const quiz=document.getElementById("quiz");
      quiz.innerHTML="";

      currentQuestions.forEach((item,qi)=>{
        const section=document.createElement("section");
        section.className="question";

        const title=document.createElement("h2");
        title.textContent=`${qi+1}. ${item.q}`;
        section.appendChild(title);

        const choices=document.createElement("div");
        choices.className="choices";

        item.choices.forEach((text,ci)=>{
          const button=document.createElement("button");
          button.className="choice";
          button.textContent=`${ci+1}. ${text}`;
          button.addEventListener("click",()=>checkAnswer(qi,ci,button,section));
          choices.appendChild(button);
        });

        const result=document.createElement("div");
        result.className="result";

        const explain=document.createElement("div");
        explain.className="explain";

        section.appendChild(choices);
        section.appendChild(result);
        section.appendChild(explain);
        quiz.appendChild(section);
      });
    }

    function checkAnswer(qi,ci,selected,section){
      if(answered[qi]) return;

      answered[qi]=true;
      done++;

      const item=currentQuestions[qi];
      const buttons=section.querySelectorAll(".choice");
      const result=section.querySelector(".result");
      const explain=section.querySelector(".explain");

      buttons.forEach((button,index)=>{
        button.disabled=true;
        if(index===item.answer) button.classList.add("correct");
      });

      if(ci===item.answer){
        score++;
        result.textContent="⭕ 정답이에요!";
      }else{
        selected.classList.add("wrong");
        result.textContent=`❌ 정답은 ‘${item.choices[item.answer]}’이에요.`;
      }

      explain.textContent=`💡 ${item.explanation}`;
      explain.style.display="block";

      document.getElementById("score").textContent=score;
      document.getElementById("done").textContent=done;

      if(done===currentQuestions.length){
        showFinalMessage();
      }
    }

    function showFinalMessage(){
      const box=document.getElementById("finalMessage");
      const total=currentQuestions.length;
      const ratio=score/total;
      let message="";

      if(score===total){
        message=`🏆 결과<span class="final-score">${score} / ${total}</span>🎉 말 박사네요! 모두 정확히 알고 있어요.`;
      }else if(ratio>=0.8){
        message=`🏆 결과<span class="final-score">${score} / ${total}</span>👏 정말 잘했어요! 조금만 더 하면 만점이에요.`;
      }else if(ratio>=0.55){
        message=`🏆 결과<span class="final-score">${score} / ${total}</span>🌟 잘했어요! 헷갈린 문제만 다시 살펴보세요.`;
      }else{
        message=`🏆 결과<span class="final-score">${score} / ${total}</span>🌱 다시 도전하면 더 잘할 수 있어요!`;
      }

      box.innerHTML=message;
      box.style.display="block";
      document.getElementById("buttons").style.display="grid";
      box.scrollIntoView({behavior:"smooth",block:"center"});
    }

    function restartOriginal(){
      currentQuestions=deepCopy(originalQuestions);
      renderQuiz();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    function restartRandom(){
      currentQuestions=shuffle(deepCopy(originalQuestions));

      currentQuestions.forEach(item=>{
        const correctText=item.choices[item.answer];
        item.choices=shuffle([...item.choices]);
        item.answer=item.choices.indexOf(correctText);
      });

      renderQuiz();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    initPage();
  </script>
</body>
</html>
