
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수박 퀴즈 | 엄마의 1분 상식</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <div class="topbar">
    <a class="home-link" href="index.html">← 퀴즈 홈</a>
    <span class="badge">🍉 여름 과일</span>
  </div>

  <section class="hero">
    <div class="eyebrow">🔎 아이의 1분 상식</div>
    <h1>🍉 수박 퀴즈</h1>
    <p class="subtitle">수박에 관한 5가지 비밀을 맞혀 보세요!</p>
  </section>

  <section id="quizScreen">
    <div class="progress-area">
      <div class="progress-label">
        <span id="progressText">1 / 5</span>
        <span id="scoreText">점수 0</span>
      </div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <article class="card">
      <div class="topic" id="topic">수박 상식</div>
      <h2 class="question" id="question"></h2>
      <div class="choices" id="choices"></div>

      <div class="feedback" id="feedback">
        <div class="feedback-title" id="feedbackTitle"></div>
        <div id="explanation"></div>
      </div>

      <div class="actions">
        <button class="action next" id="nextButton">다음 문제</button>
      </div>
    </article>
  </section>

  <section class="card result" id="resultScreen">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="score" id="finalScore"></div>
    <p class="message" id="resultMessage"></p>
    <div class="actions">
      <button class="action restart" id="restartButton">다시 풀기</button>
      <a class="action restart" href="index.html" style="display:flex;align-items:center;justify-content:center;">퀴즈 홈</a>
    </div>
  </section>

  <div class="footer">엄마와 아이가 함께 푸는 재미있는 상식 퀴즈</div>
</main>

<script>
const quizData = [
  {
    topic:"수박은 왜 두드릴까요?",
    question:"수박을 두드려 보는 이유는 무엇일까요?",
    choices:["씨를 작게 만들려고","잘 익었는지 소리로 짐작하려고","수박을 더 달게 하려고"],
    answer:1,
    explanation:"수박을 두드렸을 때 나는 소리로 속이 잘 익었는지 짐작하기도 해요. 다만 소리만으로 정확히 판단하기는 어려워요."
  },
  {
    topic:"수박은 왜 줄무늬가 있을까요?",
    question:"수박 껍질의 줄무늬는 왜 생길까요?",
    choices:["사람이 물감으로 그려서","햇빛을 받은 부분만 타서","수박 품종의 특징이 자라면서 나타나서"],
    answer:2,
    explanation:"수박의 줄무늬는 품종에 따라 정해지는 껍질 무늬로, 열매가 자라면서 함께 나타나요."
  },
  {
    topic:"씨 없는 수박은 어떻게 만들까요?",
    question:"씨 없는 수박은 보통 어떻게 만들까요?",
    choices:["염색체 수가 다른 수박을 교배해서","씨를 하나씩 모두 빼서","꽃에 물을 주지 않아서"],
    answer:0,
    explanation:"염색체 수가 다른 수박을 교배하면 씨가 제대로 자라지 않는 수박을 만들 수 있어요."
  },
  {
    topic:"수박은 왜 빨간색일까요?",
    question:"빨간 수박 속에는 어떤 색소가 들어 있을까요?",
    choices:["엽록소","멜라닌","라이코펜"],
    answer:2,
    explanation:"라이코펜이라는 붉은색 천연 색소가 들어 있어 수박 속이 빨갛게 보여요."
  },
  {
    topic:"냉장고에 오래 넣으면 왜 맛이 떨어질까요?",
    question:"자르지 않은 수박을 너무 차가운 곳에 오래 두면 어떻게 될 수 있을까요?",
    choices:["계속 더 달아져요","향과 맛이 줄고 냉해를 입을 수 있어요","씨가 모두 사라져요"],
    answer:1,
    explanation:"자르지 않은 수박은 너무 낮은 온도에 오래 두면 냉해를 입어 향과 식감이 떨어질 수 있어요. 자른 수박은 반드시 냉장 보관해야 해요."
  }
];

let currentIndex=0, score=0, answered=false;
const $=id=>document.getElementById(id);
const quizScreen=$("quizScreen"), resultScreen=$("resultScreen"), topicEl=$("topic"),
questionEl=$("question"), choicesEl=$("choices"), feedbackEl=$("feedback"),
feedbackTitleEl=$("feedbackTitle"), explanationEl=$("explanation"),
nextButton=$("nextButton"), progressText=$("progressText"),
progressBar=$("progressBar"), scoreText=$("scoreText"),
finalScore=$("finalScore"), resultMessage=$("resultMessage"),
resultEmoji=$("resultEmoji"), restartButton=$("restartButton");

function renderQuestion(){
  answered=false; feedbackEl.classList.remove("show"); nextButton.style.display="none"; choicesEl.innerHTML="";
  const item=quizData[currentIndex];
  topicEl.textContent=item.topic;
  questionEl.textContent=`Q${currentIndex+1}. ${item.question}`;
  progressText.textContent=`${currentIndex+1} / ${quizData.length}`;
  progressBar.style.width=`${(currentIndex/quizData.length)*100}%`;
  scoreText.textContent=`점수 ${score}`;
  item.choices.forEach((choice,index)=>{
    const button=document.createElement("button");
    button.className="choice";
    button.textContent=`${["①","②","③"][index]} ${choice}`;
    button.addEventListener("click",()=>selectAnswer(index));
    choicesEl.appendChild(button);
  });
}
function selectAnswer(selectedIndex){
  if(answered)return; answered=true;
  const item=quizData[currentIndex];
  const buttons=[...document.querySelectorAll(".choice")];
  const isCorrect=selectedIndex===item.answer;
  buttons.forEach((button,index)=>{
    button.disabled=true;
    if(index===item.answer)button.classList.add("correct");
    if(index===selectedIndex&&!isCorrect)button.classList.add("wrong");
  });
  if(isCorrect){
    score++; feedbackTitleEl.textContent="정답이에요! 👏"; feedbackTitleEl.className="feedback-title correct-text";
  }else{
    feedbackTitleEl.textContent="아쉬워요. 정답을 확인해 볼까요? 😊"; feedbackTitleEl.className="feedback-title wrong-text";
  }
  explanationEl.textContent=item.explanation;
  feedbackEl.classList.add("show");
  scoreText.textContent=`점수 ${score}`;
  nextButton.textContent=currentIndex===quizData.length-1?"결과 보기":"다음 문제";
  nextButton.style.display="block";
}
function showResult(){
  quizScreen.style.display="none"; resultScreen.classList.add("show");
  finalScore.textContent=`${quizData.length}문제 중 ${score}문제 정답!`;
  if(score===quizData.length){
    resultEmoji.textContent="🏆"; resultMessage.textContent="수박 박사 탄생! 모든 문제를 정확하게 맞혔어요.";
  }else if(score>=3){
    resultEmoji.textContent="👏"; resultMessage.textContent="아주 잘했어요! 해설을 한 번 더 읽으면 수박 박사가 될 수 있어요.";
  }else{
    resultEmoji.textContent="🌱"; resultMessage.textContent="괜찮아요. 새롭게 알게 된 것이 있다면 이미 멋진 공부를 한 거예요.";
  }
}
nextButton.addEventListener("click",()=>{
  if(currentIndex<quizData.length-1){currentIndex++;renderQuestion();window.scrollTo({top:0,behavior:"smooth"});}
  else{showResult();window.scrollTo({top:0,behavior:"smooth"});}
});
restartButton.addEventListener("click",()=>{
  currentIndex=0;score=0;resultScreen.classList.remove("show");quizScreen.style.display="block";renderQuestion();window.scrollTo({top:0,behavior:"smooth"});
});
renderQuestion();
</script>
</body>
</html>
