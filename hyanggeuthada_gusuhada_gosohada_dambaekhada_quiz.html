
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>향긋하다·구수하다·고소하다·담백하다 퀴즈</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
      background: #fffaf5;
      color: #333;
    }
    .wrap {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 22px 15px 45px;
    }
    .hero {
      padding: 27px 18px;
      margin-bottom: 20px;
      text-align: center;
      background: linear-gradient(135deg, #f6e7ff, #fff1c9);
      border-radius: 24px;
      box-shadow: 0 7px 20px rgba(0,0,0,.08);
    }
    .hero h1 {
      margin: 0 0 10px;
      font-size: 27px;
      line-height: 1.45;
    }
    .hero p {
      margin: 0;
      font-size: 17px;
      line-height: 1.6;
    }
    .progress {
      position: sticky;
      top: 8px;
      z-index: 10;
      margin-bottom: 16px;
      padding: 12px 16px;
      text-align: center;
      color: #fff;
      background: #4a424d;
      border-radius: 15px;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 5px 15px rgba(0,0,0,.15);
    }
    .question {
      margin-bottom: 16px;
      padding: 20px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 5px 16px rgba(0,0,0,.07);
    }
    .question h2 {
      margin: 0 0 14px;
      font-size: 20px;
      line-height: 1.55;
    }
    .choices {
      display: grid;
      gap: 10px;
    }
    .choice {
      width: 100%;
      padding: 14px 15px;
      border: 2px solid #e5dfe8;
      border-radius: 14px;
      background: #fffdfd;
      text-align: left;
      font-size: 18px;
      cursor: pointer;
      transition: .15s;
    }
    .choice:hover:not(:disabled) {
      background: #fbf4ff;
      transform: translateY(-1px);
    }
    .choice:disabled { cursor: default; }
    .choice.correct {
      border-color: #5dbb7a;
      background: #def7e6;
      color: #176536;
      font-weight: 700;
    }
    .choice.wrong {
      border-color: #e07373;
      background: #ffe3e3;
      color: #982626;
      font-weight: 700;
    }
    .result {
      min-height: 25px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
    }
    .explain {
      display: none;
      margin-top: 8px;
      padding: 11px 13px;
      background: #fff8df;
      border-radius: 11px;
      font-size: 16px;
      line-height: 1.55;
    }
    .summary {
      margin-top: 24px;
      padding: 21px;
      background: #f6f1ff;
      border-radius: 20px;
      font-size: 17px;
      line-height: 1.9;
    }
    .summary h3 {
      margin: 0 0 9px;
      font-size: 21px;
    }
    .final-message {
      display: none;
      margin-top: 18px;
      padding: 18px;
      background: #fff0f4;
      border-radius: 18px;
      text-align: center;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.6;
    }
    .reset {
      display: block;
      margin: 24px auto 0;
      padding: 13px 24px;
      border: 0;
      border-radius: 14px;
      background: #a77bc2;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    @media (max-width: 430px) {
      .hero h1 { font-size: 23px; }
      .question h2 { font-size: 19px; }
      .choice { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>🌸 향긋하다·구수하다<br>고소하다·담백하다</h1>
      <p>냄새와 맛을 떠올리며 가장 잘 어울리는 말을 골라 보세요!</p>
    </section>

    <div class="progress">
      맞힌 문제 <span id="score">0</span>개 · 푼 문제 <span id="done">0</span>/12
    </div>

    <div id="quiz"></div>
    <div id="finalMessage" class="final-message"></div>

    <section class="summary">
      <h3>🌱 한 번에 정리해요</h3>
      🌸 <b>향긋하다</b> : 꽃이나 차처럼 기분 좋은 향이 은은해요.<br>
      🍲 <b>구수하다</b> : 된장이나 누룽지처럼 깊고 정겨운 향과 맛이에요.<br>
      🥜 <b>고소하다</b> : 깨나 견과류, 참기름처럼 풍미가 좋아요.<br>
      🥣 <b>담백하다</b> : 자극적이지 않고 순하고 깔끔한 맛이에요.
    </section>

    <button class="reset" onclick="resetQuiz()">처음부터 다시 풀기</button>
  </main>

  <script>
    const questions = [{"q": "꽃차에서 기분 좋은 향기가 은은하게 퍼졌어요.", "choices": ["향긋하다", "구수하다", "고소하다", "담백하다"], "answer": 0, "explanation": "꽃이나 허브처럼 기분 좋은 향이 은은하게 날 때는 ‘향긋하다’가 잘 어울려요."}, {"q": "된장찌개에서 익숙하고 깊은 냄새가 났어요.", "choices": ["향긋하다", "구수하다", "고소하다", "담백하다"], "answer": 1, "explanation": "된장이나 누룽지처럼 깊고 정겨운 향과 맛은 ‘구수하다’라고 해요."}, {"q": "참기름을 뿌린 김밥에서 맛있는 냄새가 났어요.", "choices": ["향긋하다", "구수하다", "고소하다", "담백하다"], "answer": 2, "explanation": "참기름이나 깨처럼 기름진 풍미가 좋을 때는 ‘고소하다’가 알맞아요."}, {"q": "간을 세게 하지 않은 닭가슴살은 맛이 깔끔했어요.", "choices": ["향긋하다", "구수하다", "고소하다", "담백하다"], "answer": 3, "explanation": "자극적이지 않고 깔끔한 맛은 ‘담백하다’라고 해요."}, {"q": "장미꽃을 가까이에서 맡으니 좋은 향이 났어요.", "choices": ["향긋하다", "구수하다", "고소하다", "담백하다"], "answer": 0, "explanation": "꽃에서 나는 좋은 향에는 ‘향긋하다’가 잘 어울려요."}, {"q": "누룽지를 끓이니 정겨운 냄새가 퍼졌어요.", "choices": ["향긋하다", "구수하다", "고소하다", "담백하다"], "answer": 1, "explanation": "누룽지와 곡물에서 나는 깊은 향은 ‘구수하다’라고 해요."}, {"q": "볶은 깨를 뿌리니 음식 맛이 더 좋아졌어요.", "choices": ["향긋하다", "구수하다", "고소하다", "담백하다"], "answer": 2, "explanation": "깨나 땅콩처럼 씹을수록 맛있는 풍미는 ‘고소하다’예요."}, {"q": "맑은 생선탕은 간이 세지 않아 깔끔했어요.", "choices": ["향긋하다", "구수하다", "고소하다", "담백하다"], "answer": 3, "explanation": "기름지거나 자극적이지 않고 깔끔한 맛은 ‘담백하다’예요."}, {"q": "라벤더 향이 방 안 가득 은은하게 퍼졌어요.", "choices": ["향긋하다", "구수하다", "고소하다", "담백하다"], "answer": 0, "explanation": "은은하고 기분 좋은 향은 ‘향긋하다’라고 해요."}, {"q": "청국장에서 깊고 진한 냄새가 났어요.", "choices": ["향긋하다", "구수하다", "고소하다", "담백하다"], "answer": 1, "explanation": "발효 음식에서 나는 깊고 정겨운 향은 ‘구수하다’가 알맞아요."}, {"q": "구운 아몬드를 먹으니 씹을수록 맛이 좋았어요.", "choices": ["향긋하다", "구수하다", "고소하다", "담백하다"], "answer": 2, "explanation": "견과류 특유의 맛은 ‘고소하다’라고 해요."}, {"q": "두부를 그대로 먹었더니 자극적이지 않고 깔끔했어요.", "choices": ["향긋하다", "구수하다", "고소하다", "담백하다"], "answer": 3, "explanation": "순하고 깔끔한 맛에는 ‘담백하다’가 잘 어울려요."}];
    let score = 0;
    let done = 0;
    const answered = Array(questions.length).fill(false);

    function renderQuiz() {
      const quiz = document.getElementById("quiz");
      quiz.innerHTML = "";

      questions.forEach((item, questionIndex) => {
        const section = document.createElement("section");
        section.className = "question";

        const title = document.createElement("h2");
        title.textContent = `${questionIndex + 1}. ${item.q}`;
        section.appendChild(title);

        const choices = document.createElement("div");
        choices.className = "choices";

        item.choices.forEach((choiceText, choiceIndex) => {
          const button = document.createElement("button");
          button.className = "choice";
          button.textContent = `${choiceIndex + 1}. ${choiceText}`;
          button.addEventListener("click", () => {
            checkAnswer(questionIndex, choiceIndex, button, section);
          });
          choices.appendChild(button);
        });

        const result = document.createElement("div");
        result.className = "result";

        const explain = document.createElement("div");
        explain.className = "explain";

        section.appendChild(choices);
        section.appendChild(result);
        section.appendChild(explain);
        quiz.appendChild(section);
      });
    }

    function checkAnswer(questionIndex, choiceIndex, selectedButton, section) {
      if (answered[questionIndex]) return;

      answered[questionIndex] = true;
      done += 1;

      const item = questions[questionIndex];
      const buttons = section.querySelectorAll(".choice");
      const result = section.querySelector(".result");
      const explain = section.querySelector(".explain");

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === item.answer) {
          button.classList.add("correct");
        }
      });

      if (choiceIndex === item.answer) {
        score += 1;
        result.textContent = "⭕ 정답이에요!";
      } else {
        selectedButton.classList.add("wrong");
        result.textContent = `❌ 정답은 ‘${item.choices[item.answer]}’이에요.`;
      }

      explain.textContent = `💡 ${item.explanation}`;
      explain.style.display = "block";

      document.getElementById("score").textContent = score;
      document.getElementById("done").textContent = done;

      if (done === questions.length) {
        showFinalMessage();
      }
    }

    function showFinalMessage() {
      const box = document.getElementById("finalMessage");

      if (score === 12) {
        box.textContent = "🎉 12문제를 모두 맞혔어요! 향과 맛의 차이를 정확히 알고 있네요.";
      } else if (score >= 9) {
        box.textContent = `👏 ${score}문제를 맞혔어요! 헷갈린 문제만 다시 살펴보세요.`;
      } else {
        box.textContent = `🌱 ${score}문제를 맞혔어요. 아래 정리를 읽고 다시 도전해 보세요!`;
      }

      box.style.display = "block";
      box.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetQuiz() {
      score = 0;
      done = 0;
      answered.fill(false);
      document.getElementById("score").textContent = "0";
      document.getElementById("done").textContent = "0";
      document.getElementById("finalMessage").style.display = "none";
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    renderQuiz();
  </script>
</body>
</html>
