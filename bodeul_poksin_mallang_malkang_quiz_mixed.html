
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보들보들·폭신폭신·말랑말랑·말캉말캉 퀴즈</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;background:#fff9fb;color:#333}
    .wrap{width:min(720px,100%);margin:0 auto;padding:22px 15px 45px}
    .hero{padding:27px 18px;margin-bottom:20px;text-align:center;background:linear-gradient(135deg,#fce5ec,#eee8ff);border-radius:24px;box-shadow:0 7px 20px rgba(0,0,0,.08)}
    .hero h1{margin:0 0 10px;font-size:25px;line-height:1.45}
    .hero p{margin:0;font-size:17px;line-height:1.6}
    .progress{position:sticky;top:8px;z-index:10;margin-bottom:16px;padding:12px 16px;text-align:center;color:#fff;background:#6a5059;border-radius:15px;font-size:17px;font-weight:700;box-shadow:0 5px 15px rgba(0,0,0,.15)}
    .question{margin-bottom:16px;padding:20px;background:#fff;border-radius:20px;box-shadow:0 5px 16px rgba(0,0,0,.07)}
    .question h2{margin:0 0 14px;font-size:20px;line-height:1.55}
    .choices{display:grid;gap:10px}
    .choice{width:100%;padding:14px 15px;border:2px solid #eadde2;border-radius:14px;background:#fffdfd;text-align:left;font-size:18px;cursor:pointer;transition:.15s}
    .choice:hover:not(:disabled){background:#fff1f5;transform:translateY(-1px)}
    .choice:disabled{cursor:default}
    .choice.correct{border-color:#5dbb7a;background:#def7e6;color:#176536;font-weight:700}
    .choice.wrong{border-color:#e07373;background:#ffe3e3;color:#982626;font-weight:700}
    .result{min-height:25px;margin-top:12px;font-size:17px;font-weight:700;line-height:1.5}
    .explain{display:none;margin-top:8px;padding:11px 13px;background:#fff8df;border-radius:11px;font-size:16px;line-height:1.55}
    .summary{margin-top:24px;padding:21px;background:#f9edf2;border-radius:20px;font-size:17px;line-height:1.9}
    .summary h3{margin:0 0 9px;font-size:21px}
    .final-message{display:none;margin-top:18px;padding:18px;background:#fff0f4;border-radius:18px;text-align:center;font-size:19px;font-weight:700;line-height:1.6}
    .reset{display:block;margin:24px auto 0;padding:13px 24px;border:0;border-radius:14px;background:#b77482;color:white;font-size:17px;font-weight:700;cursor:pointer}
    @media(max-width:430px){.hero h1{font-size:21px}.question h2{font-size:19px}.choice{font-size:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>🧸 보들보들·폭신폭신<br>말랑말랑·말캉말캉</h1>
      <p>만졌을 때의 느낌을 떠올리며 알맞은 말을 골라 보세요!</p>
    </section>

    <div class="progress">
      맞힌 문제 <span id="score">0</span>개 · 푼 문제 <span id="done">0</span>/12
    </div>

    <div id="quiz"></div>
    <div id="finalMessage" class="final-message"></div>

    <section class="summary">
      <h3>🌱 한 번에 정리해요</h3>
      🧴 <b>보들보들</b> : 피부나 천처럼 표면이 아주 부드러운 느낌<br>
      🛏️ <b>폭신폭신</b> : 솜이나 쿠션처럼 푹신하고 탄력이 있는 느낌<br>
      🍞 <b>말랑말랑</b> : 누르면 쉽게 들어가고 모양이 바뀌는 부드러운 상태<br>
      🍮 <b>말캉말캉</b> : 젤리나 푸딩처럼 촉촉하고 탱글한 부드러움
    </section>

    <button class="reset" onclick="resetQuiz()">처음부터 다시 풀기</button>
  </main>

  <script>
    const questions = [{"q": "새 베개에 머리를 대니 푹 들어가면서 편안했어요.", "choices": ["보들보들", "말랑말랑", "폭신폭신", "말캉말캉"], "answer": 2, "explanation": "솜이나 쿠션처럼 눌렀을 때 푹신하고 탄력이 있는 느낌은 ‘폭신폭신’이에요."}, {"q": "젤리를 손가락으로 누르니 탱글하면서 부드럽게 흔들렸어요.", "choices": ["말캉말캉", "보들보들", "폭신폭신", "말랑말랑"], "answer": 0, "explanation": "젤리처럼 물기가 있고 탱글탱글하면서 부드러운 느낌은 ‘말캉말캉’이에요."}, {"q": "아기 볼을 만지니 피부가 아주 부드러웠어요.", "choices": ["폭신폭신", "말랑말랑", "말캉말캉", "보들보들"], "answer": 3, "explanation": "피부나 천처럼 표면이 매우 부드러운 느낌은 ‘보들보들’이에요."}, {"q": "찰흙을 손으로 누르니 쉽게 모양이 바뀌었어요.", "choices": ["보들보들", "말랑말랑", "폭신폭신", "말캉말캉"], "answer": 1, "explanation": "손으로 누르면 쉽게 들어가고 모양이 바뀌는 부드러운 상태는 ‘말랑말랑’이에요."}, {"q": "새 수건을 만지니 표면이 매끄럽고 부드러웠어요.", "choices": ["말랑말랑", "말캉말캉", "폭신폭신", "보들보들"], "answer": 3, "explanation": "천의 표면이 매끄럽고 부드러울 때는 ‘보들보들’이 잘 어울려요."}, {"q": "잘 익은 바나나를 손으로 눌렀더니 부드럽게 들어갔어요.", "choices": ["말랑말랑", "말캉말캉", "보들보들", "폭신폭신"], "answer": 0, "explanation": "잘 익은 과일처럼 쉽게 눌리는 부드러운 상태는 ‘말랑말랑’이에요."}, {"q": "소파 쿠션을 눌렀더니 푹 들어갔다가 다시 올라왔어요.", "choices": ["말랑말랑", "폭신폭신", "보들보들", "말캉말캉"], "answer": 1, "explanation": "푹 들어갔다가 다시 올라오는 포근한 탄력은 ‘폭신폭신’이에요."}, {"q": "푸딩을 숟가락으로 떠 보니 탱글하고 부드러웠어요.", "choices": ["폭신폭신", "보들보들", "말캉말캉", "말랑말랑"], "answer": 2, "explanation": "푸딩이나 젤리처럼 촉촉하고 탱글한 느낌은 ‘말캉말캉’이에요."}, {"q": "반죽을 주무르니 부드럽게 늘어나고 모양이 바뀌었어요.", "choices": ["말랑말랑", "폭신폭신", "말캉말캉", "보들보들"], "answer": 0, "explanation": "반죽처럼 손으로 주무르면 쉽게 변하는 부드러운 상태는 ‘말랑말랑’이에요."}, {"q": "묵을 젓가락으로 집으니 부드럽게 흔들리고 탱글했어요.", "choices": ["보들보들", "말랑말랑", "말캉말캉", "폭신폭신"], "answer": 2, "explanation": "묵처럼 촉촉하고 탱글하게 흔들리는 느낌은 ‘말캉말캉’이에요."}, {"q": "강아지의 짧은 털을 쓰다듬으니 아주 부드러웠어요.", "choices": ["말캉말캉", "폭신폭신", "말랑말랑", "보들보들"], "answer": 3, "explanation": "털이나 피부의 표면이 부드러운 느낌은 ‘보들보들’이에요."}, {"q": "솜이불 위에 누우니 몸이 푹 감싸이는 느낌이 들었어요.", "choices": ["말캉말캉", "폭신폭신", "말랑말랑", "보들보들"], "answer": 1, "explanation": "솜이불처럼 푹신하고 포근하게 받쳐 주는 느낌은 ‘폭신폭신’이에요."}];
    let score = 0;
    let done = 0;
    const answered = Array(questions.length).fill(false);

    function renderQuiz(){
      const quiz=document.getElementById("quiz");
      quiz.innerHTML="";
      questions.forEach((item,qi)=>{
        const section=document.createElement("section");
        section.className="question";

        const title=document.createElement("h2");
        title.textContent=`${qi+1}. ${item.q}`;
        section.appendChild(title);

        const choices=document.createElement("div");
        choices.className="choices";

        item.choices.forEach((text,ci)=>{
          const button=document.createElement("button");
          button.className="choice";
          button.textContent=`${ci+1}. ${text}`;
          button.addEventListener("click",()=>checkAnswer(qi,ci,button,section));
          choices.appendChild(button);
        });

        const result=document.createElement("div");
        result.className="result";
        const explain=document.createElement("div");
        explain.className="explain";

        section.appendChild(choices);
        section.appendChild(result);
        section.appendChild(explain);
        quiz.appendChild(section);
      });
    }

    function checkAnswer(qi,ci,selected,section){
      if(answered[qi]) return;
      answered[qi]=true;
      done++;

      const item=questions[qi];
      const buttons=section.querySelectorAll(".choice");
      const result=section.querySelector(".result");
      const explain=section.querySelector(".explain");

      buttons.forEach((button,index)=>{
        button.disabled=true;
        if(index===item.answer) button.classList.add("correct");
      });

      if(ci===item.answer){
        score++;
        result.textContent="⭕ 정답이에요!";
      }else{
        selected.classList.add("wrong");
        result.textContent=`❌ 정답은 ‘${item.choices[item.answer]}’이에요.`;
      }

      explain.textContent=`💡 ${item.explanation}`;
      explain.style.display="block";
      document.getElementById("score").textContent=score;
      document.getElementById("done").textContent=done;

      if(done===questions.length) showFinalMessage();
    }

    function showFinalMessage(){
      const box=document.getElementById("finalMessage");
      if(score===12){
        box.textContent="🎉 12문제를 모두 맞혔어요! 네 가지 촉감의 차이를 정확히 알고 있네요.";
      }else if(score>=9){
        box.textContent=`👏 ${score}문제를 맞혔어요! 헷갈린 문제만 다시 살펴보세요.`;
      }else{
        box.textContent=`🌱 ${score}문제를 맞혔어요. 아래 정리를 읽고 다시 도전해 보세요!`;
      }
      box.style.display="block";
      box.scrollIntoView({behavior:"smooth",block:"center"});
    }

    function resetQuiz(){
      score=0;
      done=0;
      answered.fill(false);
      document.getElementById("score").textContent="0";
      document.getElementById("done").textContent="0";
      document.getElementById("finalMessage").style.display="none";
      renderQuiz();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    renderQuiz();
  </script>
</body>
</html>
