
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>따뜻하다·포근하다·훈훈하다·후텁지근하다 퀴즈</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
      background: #fff9f2;
      color: #333;
    }
    .wrap {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 22px 15px 45px;
    }
    .hero {
      padding: 27px 18px;
      margin-bottom: 20px;
      text-align: center;
      background: linear-gradient(135deg, #ffe6c7, #f4e5ff);
      border-radius: 24px;
      box-shadow: 0 7px 20px rgba(0,0,0,.08);
    }
    .hero h1 {
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.45;
    }
    .hero p {
      margin: 0;
      font-size: 17px;
      line-height: 1.6;
    }
    .progress {
      position: sticky;
      top: 8px;
      z-index: 10;
      margin-bottom: 16px;
      padding: 12px 16px;
      text-align: center;
      color: white;
      background: #4b4038;
      border-radius: 15px;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 5px 15px rgba(0,0,0,.15);
    }
    .question {
      margin-bottom: 16px;
      padding: 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 16px rgba(0,0,0,.07);
    }
    .question h2 {
      margin: 0 0 14px;
      font-size: 20px;
      line-height: 1.55;
    }
    .choices {
      display: grid;
      gap: 10px;
    }
    .choice {
      width: 100%;
      padding: 14px 15px;
      border: 2px solid #eadfd4;
      border-radius: 14px;
      background: #fffdfb;
      text-align: left;
      font-size: 18px;
      cursor: pointer;
      transition: .15s;
    }
    .choice:hover:not(:disabled) {
      background: #fff2e5;
      transform: translateY(-1px);
    }
    .choice:disabled { cursor: default; }
    .choice.correct {
      border-color: #5dbb7a;
      background: #def7e6;
      color: #176536;
      font-weight: 700;
    }
    .choice.wrong {
      border-color: #e07373;
      background: #ffe3e3;
      color: #982626;
      font-weight: 700;
    }
    .result {
      min-height: 25px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
    }
    .explain {
      display: none;
      margin-top: 8px;
      padding: 11px 13px;
      background: #fff7dc;
      border-radius: 11px;
      font-size: 16px;
      line-height: 1.55;
    }
    .summary {
      margin-top: 24px;
      padding: 21px;
      background: #fff1df;
      border-radius: 20px;
      font-size: 17px;
      line-height: 1.9;
    }
    .summary h3 {
      margin: 0 0 9px;
      font-size: 21px;
    }
    .final-message {
      display: none;
      margin-top: 18px;
      padding: 18px;
      background: #fff0f4;
      border-radius: 18px;
      text-align: center;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.6;
    }
    .reset {
      display: block;
      margin: 24px auto 0;
      padding: 13px 24px;
      border: 0;
      border-radius: 14px;
      background: #c98450;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    @media (max-width: 430px) {
      .hero h1 { font-size: 22px; }
      .question h2 { font-size: 19px; }
      .choice { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>🌡️ 따뜻하다·포근하다<br>훈훈하다·후텁지근하다</h1>
      <p>온도와 느낌을 떠올리며 가장 잘 어울리는 말을 골라 보세요!</p>
    </section>

    <div class="progress">
      맞힌 문제 <span id="score">0</span>개 · 푼 문제 <span id="done">0</span>/12
    </div>

    <div id="quiz"></div>
    <div id="finalMessage" class="final-message"></div>

    <section class="summary">
      <h3>🌱 한 번에 정리해요</h3>
      ☀️ <b>따뜻하다</b> : 차갑지 않고 알맞은 온기가 있어요.<br>
      🛏️ <b>포근하다</b> : 부드럽고 아늑하게 감싸 주는 느낌이에요.<br>
      🫶 <b>훈훈하다</b> : 공간이나 마음에 기분 좋은 온기가 감돌아요.<br>
      💦 <b>후텁지근하다</b> : 덥고 습해서 답답하고 불쾌해요.
    </section>

    <button class="reset" onclick="resetQuiz()">처음부터 다시 풀기</button>
  </main>

  <script>
    const questions = [{"q": "난로를 켜자 교실 안에 기분 좋은 온기가 퍼졌어요.", "choices": ["따뜻하다", "포근하다", "훈훈하다", "후텁지근하다"], "answer": 2, "explanation": "공간 전체에 기분 좋은 온기가 감돌 때는 ‘훈훈하다’라고 해요."}, {"q": "햇볕을 쬐니 손이 차갑지 않고 기분 좋게 데워졌어요.", "choices": ["따뜻하다", "포근하다", "훈훈하다", "후텁지근하다"], "answer": 0, "explanation": "차갑지 않고 알맞게 온기가 느껴질 때는 ‘따뜻하다’가 알맞아요."}, {"q": "비가 오기 전이라 공기가 덥고 습해 몸이 답답했어요.", "choices": ["따뜻하다", "포근하다", "훈훈하다", "후텁지근하다"], "answer": 3, "explanation": "기온과 습도가 높아 덥고 답답할 때는 ‘후텁지근하다’가 알맞아요."}, {"q": "두꺼운 이불 속에 들어가니 부드럽고 아늑했어요.", "choices": ["따뜻하다", "포근하다", "훈훈하다", "후텁지근하다"], "answer": 1, "explanation": "부드럽고 아늑하게 감싸 주는 느낌은 ‘포근하다’예요."}, {"q": "엄마가 데워 준 우유가 마시기 좋을 만큼 알맞게 뜨거웠어요.", "choices": ["후텁지근하다", "포근하다", "훈훈하다", "따뜻하다"], "answer": 3, "explanation": "음식이나 물체에 알맞은 온기가 있을 때는 ‘따뜻하다’라고 해요."}, {"q": "복슬복슬한 담요를 덮으니 몸과 마음이 편안해졌어요.", "choices": ["포근하다", "훈훈하다", "후텁지근하다", "따뜻하다"], "answer": 0, "explanation": "부드럽게 감싸 주어 편안하고 아늑한 느낌은 ‘포근하다’예요."}, {"q": "도움을 받은 이웃의 이야기를 들으니 마음까지 따뜻해졌어요.", "choices": ["후텁지근하다", "훈훈하다", "따뜻하다", "포근하다"], "answer": 1, "explanation": "사람의 정이나 좋은 이야기로 마음이 따뜻해지는 느낌도 ‘훈훈하다’라고 해요."}, {"q": "창문을 닫아 둔 방 안이 덥고 습해서 땀이 났어요.", "choices": ["포근하다", "훈훈하다", "후텁지근하다", "따뜻하다"], "answer": 2, "explanation": "공기가 덥고 습해 불쾌하고 답답하면 ‘후텁지근하다’예요."}, {"q": "고양이가 엄마 품에 폭 안겨 편안하게 잠들었어요.", "choices": ["포근하다", "후텁지근하다", "따뜻하다", "훈훈하다"], "answer": 0, "explanation": "품이나 이불처럼 아늑하고 편안한 느낌은 ‘포근하다’예요."}, {"q": "장마철 오후라 바람도 없고 공기가 눅눅하면서 더웠어요.", "choices": ["훈훈하다", "따뜻하다", "후텁지근하다", "포근하다"], "answer": 2, "explanation": "습기가 많고 더워 답답한 날씨는 ‘후텁지근하다’예요."}, {"q": "차가웠던 손을 난로 가까이에 대니 온기가 느껴졌어요.", "choices": ["훈훈하다", "후텁지근하다", "포근하다", "따뜻하다"], "answer": 3, "explanation": "차갑던 것이 온기를 띠게 되면 ‘따뜻하다’가 알맞아요."}, {"q": "아이들이 서로 도와주는 모습을 보니 교실 분위기가 정겨웠어요.", "choices": ["포근하다", "훈훈하다", "후텁지근하다", "따뜻하다"], "answer": 1, "explanation": "정답고 따뜻한 분위기나 이야기는 ‘훈훈하다’라고 표현해요."}];
    let score = 0;
    let done = 0;
    const answered = Array(questions.length).fill(false);

    function renderQuiz() {
      const quiz = document.getElementById("quiz");
      quiz.innerHTML = "";

      questions.forEach((item, questionIndex) => {
        const section = document.createElement("section");
        section.className = "question";

        const title = document.createElement("h2");
        title.textContent = `${questionIndex + 1}. ${item.q}`;
        section.appendChild(title);

        const choices = document.createElement("div");
        choices.className = "choices";

        item.choices.forEach((choiceText, choiceIndex) => {
          const button = document.createElement("button");
          button.className = "choice";
          button.textContent = `${choiceIndex + 1}. ${choiceText}`;
          button.addEventListener("click", () => {
            checkAnswer(questionIndex, choiceIndex, button, section);
          });
          choices.appendChild(button);
        });

        const result = document.createElement("div");
        result.className = "result";

        const explain = document.createElement("div");
        explain.className = "explain";

        section.appendChild(choices);
        section.appendChild(result);
        section.appendChild(explain);
        quiz.appendChild(section);
      });
    }

    function checkAnswer(questionIndex, choiceIndex, selectedButton, section) {
      if (answered[questionIndex]) return;

      answered[questionIndex] = true;
      done += 1;

      const item = questions[questionIndex];
      const buttons = section.querySelectorAll(".choice");
      const result = section.querySelector(".result");
      const explain = section.querySelector(".explain");

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === item.answer) {
          button.classList.add("correct");
        }
      });

      if (choiceIndex === item.answer) {
        score += 1;
        result.textContent = "⭕ 정답이에요!";
      } else {
        selectedButton.classList.add("wrong");
        result.textContent = `❌ 정답은 ‘${item.choices[item.answer]}’이에요.`;
      }

      explain.textContent = `💡 ${item.explanation}`;
      explain.style.display = "block";

      document.getElementById("score").textContent = score;
      document.getElementById("done").textContent = done;

      if (done === questions.length) {
        showFinalMessage();
      }
    }

    function showFinalMessage() {
      const box = document.getElementById("finalMessage");

      if (score === 12) {
        box.textContent = "🎉 12문제를 모두 맞혔어요! 네 가지 느낌의 차이를 정확히 알고 있네요.";
      } else if (score >= 9) {
        box.textContent = `👏 ${score}문제를 맞혔어요! 헷갈린 문제만 다시 살펴보세요.`;
      } else {
        box.textContent = `🌱 ${score}문제를 맞혔어요. 아래 정리를 읽고 다시 도전해 보세요!`;
      }

      box.style.display = "block";
      box.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetQuiz() {
      score = 0;
      done = 0;
      answered.fill(false);
      document.getElementById("score").textContent = "0";
      document.getElementById("done").textContent = "0";
      document.getElementById("finalMessage").style.display = "none";
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    renderQuiz();
  </script>
</body>
</html>
