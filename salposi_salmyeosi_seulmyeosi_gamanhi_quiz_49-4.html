<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>살포시·살며시·슬며시·가만히의 차이 퀴즈</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#fffaf3;color:#3f3a35}
.wrap{width:min(760px,100%);margin:0 auto;padding:20px 16px 48px}
.hero{background:#f7ead6;border-radius:24px;padding:26px 20px;text-align:center;margin-bottom:18px}
.hero .eyebrow{font-size:14px;font-weight:700;color:#9a7850;margin-bottom:7px}
.hero h1{font-size:28px;line-height:1.35;margin:0 0 9px}
.hero p{margin:0;color:#746b61;line-height:1.65}
.guide{background:#fff;border:1px solid #eadfce;border-radius:20px;padding:17px 18px;margin-bottom:18px;line-height:1.75}
.guide b{color:#7b5c38}
.card{background:#fff;border:1px solid #eadfce;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 5px 16px rgba(78,56,29,.06)}
.num{font-size:13px;font-weight:800;color:#a27b4f;margin-bottom:9px}
.question{font-size:18px;font-weight:800;line-height:1.55;margin-bottom:14px}
.options{display:grid;gap:9px}
button.option{width:100%;text-align:left;border:1px solid #e7dccb;background:#fffdf9;border-radius:14px;padding:13px 14px;font-size:16px;cursor:pointer}
button.option:hover{background:#fff7e9}
button.option.correct{background:#edf8ef;border-color:#8fc79a}
button.option.wrong{background:#fff0ef;border-color:#e9a4a0}
.explanation{display:none;margin-top:12px;padding:12px 13px;background:#faf6ef;border-radius:12px;color:#655d53;line-height:1.6}
.result{display:none;background:#fff;border:1px solid #eadfce;border-radius:20px;padding:22px;text-align:center;margin-top:20px}
.result strong{font-size:25px}
.reset{margin-top:14px;border:0;border-radius:12px;background:#7b5c38;color:#fff;padding:11px 18px;font-weight:700;cursor:pointer}
.footer{margin-top:24px;text-align:center;color:#9b9186;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">📖 엄마의 말공부 #49</div>
    <h1>살포시 · 살며시 · 슬며시 · 가만히</h1>
    <p>비슷하게 조용해 보여도 느낌은 달라요.<br>장면을 읽고 가장 잘 어울리는 표현을 골라 보세요.</p>
  </section>

  <section class="guide">
    🌷 <b>살포시</b> — 가볍고 부드럽게 얹거나 내려앉는 느낌<br>
    🤫 <b>살며시</b> — 소리 나지 않게 조심스럽게 하는 모습<br>
    👀 <b>슬며시</b> — 남이 눈치채지 못하게 은근히 하는 모습<br>
    🧘 <b>가만히</b> — 움직이거나 말하지 않고 그대로 있는 모습
  </section>

  <div id="quiz"></div>
  <section class="result" id="result"></section>
  <div class="footer">엄마의 말공부 · 12문제</div>
</div>

<script>
const questions = [{"question": "민이가 자는 동생을 깨우지 않으려고 발소리를 죽여 조심스럽게 방을 나왔어요. 가장 잘 어울리는 말은?", "options": ["살며시", "살포시", "가만히", "슬며시"], "answer": 0, "explanation": "남을 방해하지 않도록 조심스럽고 가볍게 움직이는 모습은 ‘살며시’라고 할 수 있어요."}, {"question": "준이는 자는 고양이를 깨우지 않으려고 손대지 않고 조용히 바라보기만 했어요. 가장 잘 어울리는 말은?", "options": ["살포시", "가만히", "살며시", "슬며시"], "answer": 1, "explanation": "행동하지 않고 조용한 상태로 있는 모습은 ‘가만히’라고 표현할 수 있어요."}, {"question": "아기가 깨지 않도록 엄마가 방문을 조심스럽고 소리 나지 않게 닫았어요. 가장 잘 어울리는 말은?", "options": ["가만히", "슬며시", "살며시", "살포시"], "answer": 2, "explanation": "소리가 나지 않도록 조심스럽게 행동하는 모습에는 ‘살며시’가 잘 어울려요."}, {"question": "준이가 엄마의 눈치를 보며 장난감을 상자 뒤로 몰래 조금 밀어 넣었어요. 가장 잘 어울리는 말은?", "options": ["슬며시", "가만히", "살포시", "살며시"], "answer": 0, "explanation": "눈에 띄지 않게 은근히 움직이는 모습은 ‘슬며시’라고 표현할 수 있어요."}, {"question": "선생님이 사진을 찍는 동안 민이는 몸을 움직이지 않고 그대로 서 있었어요. 가장 잘 어울리는 말은?", "options": ["가만히", "살며시", "슬며시", "살포시"], "answer": 0, "explanation": "움직이거나 말하지 않고 그대로 있는 모습에는 ‘가만히’가 잘 어울려요."}, {"question": "엄마가 잠든 아이의 머리를 깨지 않게 조심스럽게 쓰다듬었어요. 가장 잘 어울리는 말은?", "options": ["슬며시", "살포시", "가만히", "살며시"], "answer": 3, "explanation": "상대가 깨거나 놀라지 않도록 조심스럽게 하는 행동에는 ‘살며시’가 자연스러워요."}, {"question": "엄마가 잠든 준이의 어깨 위에 이불을 가볍고 포근하게 덮어 주었어요. 가장 잘 어울리는 말은?", "options": ["살며시", "살포시", "슬며시", "가만히"], "answer": 1, "explanation": "가볍고 부드럽게 덮거나 놓는 느낌에는 ‘살포시’가 잘 어울려요."}, {"question": "친구가 부끄러운 듯 아무 말 없이 내 옆으로 은근히 가까이 다가왔어요. 가장 잘 어울리는 말은?", "options": ["살며시", "가만히", "살포시", "슬며시"], "answer": 3, "explanation": "드러내지 않고 은근하게 움직이는 모습에는 ‘슬며시’가 자연스러워요."}, {"question": "민이가 아무도 눈치채지 못하게 간식 접시를 자기 쪽으로 조금 당겼어요. 가장 잘 어울리는 말은?", "options": ["살며시", "살포시", "슬며시", "가만히"], "answer": 2, "explanation": "남이 눈치채지 못하도록 은근하게 행동하는 모습에는 ‘슬며시’가 잘 어울려요."}, {"question": "민이가 꽃잎을 손바닥 위에 가볍게 올려놓았어요. 가장 잘 어울리는 말은?", "options": ["살며시", "슬며시", "살포시", "가만히"], "answer": 2, "explanation": "가볍고 부드럽게 내려놓거나 얹는 모습은 ‘살포시’로 표현할 수 있어요."}, {"question": "눈송이가 민이의 장갑 위에 가볍게 내려앉았어요. 가장 잘 어울리는 말은?", "options": ["살며시", "슬며시", "가만히", "살포시"], "answer": 3, "explanation": "가볍고 포근하게 내려앉는 느낌에는 ‘살포시’가 자연스러워요."}, {"question": "엄마가 체온을 재는 동안 아이가 몸을 움직이지 않고 그대로 있었어요. 가장 잘 어울리는 말은?", "options": ["슬며시", "가만히", "살며시", "살포시"], "answer": 1, "explanation": "몸을 움직이지 않고 그대로 있는 상태에는 ‘가만히’가 자연스러워요."}];

const quiz = document.getElementById("quiz");
let score = 0;
let answered = 0;

questions.forEach((q, idx) => {
  const card = document.createElement("section");
  card.className = "card";
  card.innerHTML = `
    <div class="num">문제 ${idx+1}</div>
    <div class="question">${q.question}</div>
    <div class="options"></div>
    <div class="explanation">${q.explanation}</div>
  `;
  const options = card.querySelector(".options");
  const explanation = card.querySelector(".explanation");

  q.options.forEach((opt, oi) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = `${["①","②","③","④"][oi]} ${opt}`;
    btn.addEventListener("click", () => {
      if (card.dataset.answered) return;
      card.dataset.answered = "1";
      answered += 1;

      [...options.children].forEach((b, bi) => {
        b.disabled = true;
        if (bi === q.answer) b.classList.add("correct");
      });

      if (oi === q.answer) score += 1;
      else btn.classList.add("wrong");

      explanation.style.display = "block";

      if (answered === questions.length) {
        const result = document.getElementById("result");
        result.style.display = "block";
        result.innerHTML = `<strong>${score} / ${questions.length}</strong><br>끝까지 잘 풀었어요!<br>
        <button class="reset" onclick="location.reload()">다시 풀기</button>`;
      }
    });
    options.appendChild(btn);
  });
  quiz.appendChild(card);
});
</script>
</body>
</html>
