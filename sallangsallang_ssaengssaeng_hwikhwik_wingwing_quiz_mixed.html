
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>살랑살랑·쌩쌩·휙휙·윙윙 퀴즈</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;background:#f5fbfe;color:#333}
    .wrap{width:min(720px,100%);margin:0 auto;padding:22px 15px 45px}
    .hero{padding:27px 18px;margin-bottom:20px;text-align:center;background:linear-gradient(135deg,#dff3fb,#e8eefc);border-radius:24px;box-shadow:0 7px 20px rgba(0,0,0,.08)}
    .hero h1{margin:0 0 10px;font-size:25px;line-height:1.45}
    .hero p{margin:0;font-size:17px;line-height:1.6}
    .progress{position:sticky;top:8px;z-index:10;margin-bottom:16px;padding:12px 16px;text-align:center;color:#fff;background:#3f6f89;border-radius:15px;font-size:17px;font-weight:700;box-shadow:0 5px 15px rgba(0,0,0,.15)}
    .question{margin-bottom:16px;padding:20px;background:#fff;border-radius:20px;box-shadow:0 5px 16px rgba(0,0,0,.07)}
    .question h2{margin:0 0 14px;font-size:20px;line-height:1.55}
    .choices{display:grid;gap:10px}
    .choice{width:100%;padding:14px 15px;border:2px solid #dce9ef;border-radius:14px;background:#fcfeff;text-align:left;font-size:18px;cursor:pointer;transition:.15s}
    .choice:hover:not(:disabled){background:#edf8fc;transform:translateY(-1px)}
    .choice:disabled{cursor:default}
    .choice.correct{border-color:#5dbb7a;background:#def7e6;color:#176536;font-weight:700}
    .choice.wrong{border-color:#e07373;background:#ffe3e3;color:#982626;font-weight:700}
    .result{min-height:25px;margin-top:12px;font-size:17px;font-weight:700;line-height:1.5}
    .explain{display:none;margin-top:8px;padding:11px 13px;background:#fff8df;border-radius:11px;font-size:16px;line-height:1.55}
    .summary{margin-top:24px;padding:21px;background:#eaf6fb;border-radius:20px;font-size:17px;line-height:1.9}
    .summary h3{margin:0 0 9px;font-size:21px}
    .final-message{display:none;margin-top:18px;padding:18px;background:#fff0f4;border-radius:18px;text-align:center;font-size:19px;font-weight:700;line-height:1.6}
    .reset{display:block;margin:24px auto 0;padding:13px 24px;border:0;border-radius:14px;background:#5a91ad;color:white;font-size:17px;font-weight:700;cursor:pointer}
    @media(max-width:430px){.hero h1{font-size:22px}.question h2{font-size:19px}.choice{font-size:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>🍃 살랑살랑·쌩쌩<br>휙휙·윙윙</h1>
      <p>바람과 빠른 움직임, 소리를 떠올리며 알맞은 말을 골라 보세요!</p>
    </section>

    <div class="progress">
      맞힌 문제 <span id="score">0</span>개 · 푼 문제 <span id="done">0</span>/12
    </div>

    <div id="quiz"></div>
    <div id="finalMessage" class="final-message"></div>

    <section class="summary">
      <h3>🌱 한 번에 정리해요</h3>
      🍃 <b>살랑살랑</b> : 부드럽고 가벼운 바람이 천천히 불거나 흔드는 모습<br>
      🚲 <b>쌩쌩</b> : 바람이나 탈것이 매우 빠르고 세게 움직이는 모습<br>
      🌀 <b>휙휙</b> : 물건이 공기를 가르며 빠르게 움직이는 모습이나 소리<br>
      🐝 <b>윙윙</b> : 벌레나 기계의 날개·모터가 빠르게 움직이며 내는 소리
    </section>

    <button class="reset" onclick="resetQuiz()">처음부터 다시 풀기</button>
  </main>

  <script>
    const questions = [{"q": "겨울바람이 얼굴을 세게 스치며 빠르게 불었어요.", "choices": ["살랑살랑", "휙휙", "쌩쌩", "윙윙"], "answer": 2, "explanation": "바람이나 차가운 공기가 매우 빠르고 세게 부는 모습은 ‘쌩쌩’이에요."}, {"q": "봄바람이 커튼을 가볍게 흔들며 불어왔어요.", "choices": ["살랑살랑", "쌩쌩", "휙휙", "윙윙"], "answer": 0, "explanation": "부드럽고 가벼운 바람이 천천히 부는 모습은 ‘살랑살랑’이에요."}, {"q": "선풍기 날개가 빠르게 돌며 계속 소리를 냈어요.", "choices": ["살랑살랑", "쌩쌩", "휙휙", "윙윙"], "answer": 3, "explanation": "기계나 벌레가 빠르게 돌거나 날며 내는 이어지는 소리는 ‘윙윙’이에요."}, {"q": "민이가 긴 끈을 빠르게 돌리자 공중에서 소리가 났어요.", "choices": ["살랑살랑", "휙휙", "쌩쌩", "윙윙"], "answer": 1, "explanation": "물건이 공기를 가르며 빠르게 움직이는 모습이나 소리는 ‘휙휙’이에요."}, {"q": "나뭇잎이 약한 바람에 부드럽게 흔들렸어요.", "choices": ["휙휙", "윙윙", "쌩쌩", "살랑살랑"], "answer": 3, "explanation": "약한 바람에 가볍고 부드럽게 움직이는 모습은 ‘살랑살랑’이에요."}, {"q": "준이가 수건을 공중에서 빠르게 여러 번 휘둘렀어요.", "choices": ["휙휙", "윙윙", "살랑살랑", "쌩쌩"], "answer": 0, "explanation": "물건을 빠르게 휘두르거나 지나가게 하는 모습은 ‘휙휙’이에요."}, {"q": "자동차가 도로를 아주 빠르게 달려 지나갔어요.", "choices": ["휙휙", "쌩쌩", "살랑살랑", "윙윙"], "answer": 1, "explanation": "자동차나 자전거가 매우 빠르게 달리는 모습에는 ‘쌩쌩’이 잘 어울려요."}, {"q": "벌이 꽃 주변을 날아다니며 계속 소리를 냈어요.", "choices": ["쌩쌩", "휙휙", "윙윙", "살랑살랑"], "answer": 2, "explanation": "벌이나 모기처럼 날개를 빠르게 움직이며 내는 소리는 ‘윙윙’이에요."}, {"q": "마술사가 손수건을 빠르게 흔들어 공중으로 던졌어요.", "choices": ["휙휙", "쌩쌩", "윙윙", "살랑살랑"], "answer": 0, "explanation": "손이나 물건을 빠르게 움직이며 공기를 가르는 모습은 ‘휙휙’이에요."}, {"q": "드론이 머리 위를 돌며 일정한 기계 소리를 냈어요.", "choices": ["휙휙", "살랑살랑", "윙윙", "쌩쌩"], "answer": 2, "explanation": "모터나 날개가 빠르게 돌아 내는 이어지는 소리는 ‘윙윙’이에요."}, {"q": "얇은 천이 산들바람에 가볍게 흔들렸어요.", "choices": ["윙윙", "쌩쌩", "휙휙", "살랑살랑"], "answer": 3, "explanation": "산들바람에 천이나 머리카락이 부드럽게 움직이는 모습은 ‘살랑살랑’이에요."}, {"q": "자전거가 내리막길을 아주 빠르게 달렸어요.", "choices": ["윙윙", "쌩쌩", "휙휙", "살랑살랑"], "answer": 1, "explanation": "탈것이 빠르고 힘차게 달리는 모습은 ‘쌩쌩’이에요."}];
    let score = 0;
    let done = 0;
    const answered = Array(questions.length).fill(false);

    function renderQuiz(){
      const quiz=document.getElementById("quiz");
      quiz.innerHTML="";

      questions.forEach((item,qi)=>{
        const section=document.createElement("section");
        section.className="question";

        const title=document.createElement("h2");
        title.textContent=`${qi+1}. ${item.q}`;
        section.appendChild(title);

        const choices=document.createElement("div");
        choices.className="choices";

        item.choices.forEach((text,ci)=>{
          const button=document.createElement("button");
          button.className="choice";
          button.textContent=`${ci+1}. ${text}`;
          button.addEventListener("click",()=>checkAnswer(qi,ci,button,section));
          choices.appendChild(button);
        });

        const result=document.createElement("div");
        result.className="result";
        const explain=document.createElement("div");
        explain.className="explain";

        section.appendChild(choices);
        section.appendChild(result);
        section.appendChild(explain);
        quiz.appendChild(section);
      });
    }

    function checkAnswer(qi,ci,selected,section){
      if(answered[qi]) return;

      answered[qi]=true;
      done++;

      const item=questions[qi];
      const buttons=section.querySelectorAll(".choice");
      const result=section.querySelector(".result");
      const explain=section.querySelector(".explain");

      buttons.forEach((button,index)=>{
        button.disabled=true;
        if(index===item.answer) button.classList.add("correct");
      });

      if(ci===item.answer){
        score++;
        result.textContent="⭕ 정답이에요!";
      }else{
        selected.classList.add("wrong");
        result.textContent=`❌ 정답은 ‘${item.choices[item.answer]}’이에요.`;
      }

      explain.textContent=`💡 ${item.explanation}`;
      explain.style.display="block";

      document.getElementById("score").textContent=score;
      document.getElementById("done").textContent=done;

      if(done===questions.length) showFinalMessage();
    }

    function showFinalMessage(){
      const box=document.getElementById("finalMessage");

      if(score===12){
        box.textContent="🎉 12문제를 모두 맞혔어요! 네 가지 움직임과 소리의 차이를 정확히 알고 있네요.";
      }else if(score>=9){
        box.textContent=`👏 ${score}문제를 맞혔어요! 헷갈린 문제만 다시 살펴보세요.`;
      }else{
        box.textContent=`🌱 ${score}문제를 맞혔어요. 아래 정리를 읽고 다시 도전해 보세요!`;
      }

      box.style.display="block";
      box.scrollIntoView({behavior:"smooth",block:"center"});
    }

    function resetQuiz(){
      score=0;
      done=0;
      answered.fill(false);

      document.getElementById("score").textContent="0";
      document.getElementById("done").textContent="0";
      document.getElementById("finalMessage").style.display="none";

      renderQuiz();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    renderQuiz();
  </script>
</body>
</html>
