
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>촉촉하다·축축하다·눅눅하다·질척질척 퀴즈</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;background:#f6fbfc;color:#333}
    .wrap{width:min(720px,100%);margin:0 auto;padding:22px 15px 45px}
    .hero{padding:27px 18px;margin-bottom:20px;text-align:center;background:linear-gradient(135deg,#dff4f7,#edf0ff);border-radius:24px;box-shadow:0 7px 20px rgba(0,0,0,.08)}
    .hero h1{margin:0 0 10px;font-size:25px;line-height:1.45}
    .hero p{margin:0;font-size:17px;line-height:1.6}
    .progress{position:sticky;top:8px;z-index:10;margin-bottom:16px;padding:12px 16px;text-align:center;color:#fff;background:#405e66;border-radius:15px;font-size:17px;font-weight:700;box-shadow:0 5px 15px rgba(0,0,0,.15)}
    .question{margin-bottom:16px;padding:20px;background:#fff;border-radius:20px;box-shadow:0 5px 16px rgba(0,0,0,.07)}
    .question h2{margin:0 0 14px;font-size:20px;line-height:1.55}
    .choices{display:grid;gap:10px}
    .choice{width:100%;padding:14px 15px;border:2px solid #dce8eb;border-radius:14px;background:#fcfeff;text-align:left;font-size:18px;cursor:pointer;transition:.15s}
    .choice:hover:not(:disabled){background:#eef8fa;transform:translateY(-1px)}
    .choice:disabled{cursor:default}
    .choice.correct{border-color:#5dbb7a;background:#def7e6;color:#176536;font-weight:700}
    .choice.wrong{border-color:#e07373;background:#ffe3e3;color:#982626;font-weight:700}
    .result{min-height:25px;margin-top:12px;font-size:17px;font-weight:700;line-height:1.5}
    .explain{display:none;margin-top:8px;padding:11px 13px;background:#fff8df;border-radius:11px;font-size:16px;line-height:1.55}
    .summary{margin-top:24px;padding:21px;background:#eaf7f9;border-radius:20px;font-size:17px;line-height:1.9}
    .summary h3{margin:0 0 9px;font-size:21px}
    .final-message{display:none;margin-top:18px;padding:18px;background:#fff0f4;border-radius:18px;text-align:center;font-size:19px;font-weight:700;line-height:1.6}
    .reset{display:block;margin:24px auto 0;padding:13px 24px;border:0;border-radius:14px;background:#5c8993;color:white;font-size:17px;font-weight:700;cursor:pointer}
    @media(max-width:430px){.hero h1{font-size:21px}.question h2{font-size:19px}.choice{font-size:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>💧 촉촉하다·축축하다<br>눅눅하다·질척질척</h1>
      <p>물기와 습기의 정도를 떠올리며 알맞은 말을 골라 보세요!</p>
    </section>

    <div class="progress">
      맞힌 문제 <span id="score">0</span>개 · 푼 문제 <span id="done">0</span>/12
    </div>

    <div id="quiz"></div>
    <div id="finalMessage" class="final-message"></div>

    <section class="summary">
      <h3>🌱 한 번에 정리해요</h3>
      💧 <b>촉촉하다</b> : 수분이 알맞게 있어 부드럽고 기분 좋은 상태<br>
      🌧️ <b>축축하다</b> : 물기가 많아 젖은 느낌이 분명한 상태<br>
      🍘 <b>눅눅하다</b> : 습기를 먹어 바삭함이나 산뜻함이 사라진 상태<br>
      🥾 <b>질척질척</b> : 물과 흙이 섞여 질고 달라붙는 상태
    </section>

    <button class="reset" onclick="resetQuiz()">처음부터 다시 풀기</button>
  </main>

  <script>
    const questions = [{"q": "과자를 봉지째 열어 두었더니 바삭하지 않고 부드러워졌어요.", "choices": ["촉촉하다", "축축하다", "눅눅하다", "질척질척"], "answer": 2, "explanation": "습기를 먹어 바삭함이 사라지고 힘없이 부드러워진 상태는 ‘눅눅하다’예요."}, {"q": "갓 구운 케이크 속이 마르지 않고 부드럽게 수분을 머금고 있었어요.", "choices": ["촉촉하다", "축축하다", "눅눅하다", "질척질척"], "answer": 0, "explanation": "수분이 알맞게 있어 부드럽고 기분 좋은 상태는 ‘촉촉하다’예요."}, {"q": "비 온 뒤 흙길을 걸으니 진흙이 신발에 달라붙었어요.", "choices": ["촉촉하다", "축축하다", "눅눅하다", "질척질척"], "answer": 3, "explanation": "물과 흙이 섞여 발에 달라붙고 질게 느껴지는 상태는 ‘질척질척’이에요."}, {"q": "비를 맞은 운동화가 물기를 많이 머금고 있었어요.", "choices": ["촉촉하다", "축축하다", "눅눅하다", "질척질척"], "answer": 1, "explanation": "물기가 많아 젖은 느낌이 분명할 때는 ‘축축하다’라고 해요."}, {"q": "로션을 바른 피부가 마르지 않고 부드럽게 빛났어요.", "choices": ["눅눅하다", "질척질척", "축축하다", "촉촉하다"], "answer": 3, "explanation": "피부에 수분이 알맞게 있어 부드럽고 산뜻한 상태는 ‘촉촉하다’예요."}, {"q": "젖은 수건을 만지니 손에 물기가 느껴졌어요.", "choices": ["축축하다", "눅눅하다", "촉촉하다", "질척질척"], "answer": 0, "explanation": "천이나 옷에 물기가 많이 남아 젖은 느낌은 ‘축축하다’예요."}, {"q": "장마철이라 이불이 바삭하지 않고 무겁게 느껴졌어요.", "choices": ["질척질척", "눅눅하다", "촉촉하다", "축축하다"], "answer": 1, "explanation": "습기를 먹어 천이나 과자가 힘없이 무거워진 느낌은 ‘눅눅하다’예요."}, {"q": "물웅덩이 옆 진흙을 밟으니 발이 푹 빠지고 흙이 달라붙었어요.", "choices": ["축축하다", "눅눅하다", "질척질척", "촉촉하다"], "answer": 2, "explanation": "진흙처럼 물기가 많고 질어 달라붙는 모습은 ‘질척질척’이에요."}, {"q": "비에 젖은 양말을 신었더니 발이 젖은 느낌이 들었어요.", "choices": ["축축하다", "질척질척", "눅눅하다", "촉촉하다"], "answer": 0, "explanation": "물기가 많이 밴 옷이나 양말의 느낌은 ‘축축하다’예요."}, {"q": "눈이 녹은 흙길이 물과 섞여 신발 밑에 들러붙었어요.", "choices": ["눅눅하다", "촉촉하다", "질척질척", "축축하다"], "answer": 2, "explanation": "물과 흙이 섞여 질고 끈끈하게 달라붙는 상태는 ‘질척질척’이에요."}, {"q": "화분의 흙에 물을 조금 주니 표면이 알맞게 젖었어요.", "choices": ["질척질척", "축축하다", "눅눅하다", "촉촉하다"], "answer": 3, "explanation": "흙이나 피부가 너무 젖지 않고 알맞은 수분을 머금은 상태는 ‘촉촉하다’예요."}, {"q": "습한 방에 둔 김이 바삭함을 잃고 부드러워졌어요.", "choices": ["축축하다", "눅눅하다", "질척질척", "촉촉하다"], "answer": 1, "explanation": "습기 때문에 음식이 바삭하지 않게 된 상태는 ‘눅눅하다’예요."}];
    let score = 0;
    let done = 0;
    const answered = Array(questions.length).fill(false);

    function renderQuiz(){
      const quiz=document.getElementById("quiz");
      quiz.innerHTML="";

      questions.forEach((item,qi)=>{
        const section=document.createElement("section");
        section.className="question";

        const title=document.createElement("h2");
        title.textContent=`${qi+1}. ${item.q}`;
        section.appendChild(title);

        const choices=document.createElement("div");
        choices.className="choices";

        item.choices.forEach((text,ci)=>{
          const button=document.createElement("button");
          button.className="choice";
          button.textContent=`${ci+1}. ${text}`;
          button.addEventListener("click",()=>checkAnswer(qi,ci,button,section));
          choices.appendChild(button);
        });

        const result=document.createElement("div");
        result.className="result";

        const explain=document.createElement("div");
        explain.className="explain";

        section.appendChild(choices);
        section.appendChild(result);
        section.appendChild(explain);
        quiz.appendChild(section);
      });
    }

    function checkAnswer(qi,ci,selected,section){
      if(answered[qi]) return;

      answered[qi]=true;
      done++;

      const item=questions[qi];
      const buttons=section.querySelectorAll(".choice");
      const result=section.querySelector(".result");
      const explain=section.querySelector(".explain");

      buttons.forEach((button,index)=>{
        button.disabled=true;
        if(index===item.answer) button.classList.add("correct");
      });

      if(ci===item.answer){
        score++;
        result.textContent="⭕ 정답이에요!";
      }else{
        selected.classList.add("wrong");
        result.textContent=`❌ 정답은 ‘${item.choices[item.answer]}’예요.`;
      }

      explain.textContent=`💡 ${item.explanation}`;
      explain.style.display="block";

      document.getElementById("score").textContent=score;
      document.getElementById("done").textContent=done;

      if(done===questions.length) showFinalMessage();
    }

    function showFinalMessage(){
      const box=document.getElementById("finalMessage");

      if(score===12){
        box.textContent="🎉 12문제를 모두 맞혔어요! 네 가지 물기 상태의 차이를 정확히 알고 있네요.";
      }else if(score>=9){
        box.textContent=`👏 ${score}문제를 맞혔어요! 헷갈린 문제만 다시 살펴보세요.`;
      }else{
        box.textContent=`🌱 ${score}문제를 맞혔어요. 아래 정리를 읽고 다시 도전해 보세요!`;
      }

      box.style.display="block";
      box.scrollIntoView({behavior:"smooth",block:"center"});
    }

    function resetQuiz(){
      score=0;
      done=0;
      answered.fill(false);

      document.getElementById("score").textContent="0";
      document.getElementById("done").textContent="0";
      document.getElementById("finalMessage").style.display="none";

      renderQuiz();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    renderQuiz();
  </script>
</body>
</html>
