<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>흐리다·컴컴하다·캄캄하다·어둑어둑하다 퀴즈</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #f7f8fb;
      color: #30343b;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 22px 15px 44px;
    }
    .hero {
      padding: 28px 18px;
      margin-bottom: 20px;
      text-align: center;
      background: linear-gradient(135deg, #dce6f2, #f3e8d7);
      border-radius: 24px;
      box-shadow: 0 7px 20px rgba(0,0,0,.08);
    }
    .hero h1 {
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.45;
    }
    .hero p {
      margin: 0;
      font-size: 17px;
      line-height: 1.6;
    }
    .progress {
      position: sticky;
      top: 8px;
      z-index: 10;
      margin-bottom: 16px;
      padding: 12px 15px;
      background: #3e4652;
      color: #fff;
      border-radius: 15px;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 5px 15px rgba(0,0,0,.15);
    }
    .question {
      margin-bottom: 16px;
      padding: 20px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 5px 16px rgba(0,0,0,.07);
    }
    .question h2 {
      margin: 0 0 14px;
      font-size: 20px;
      line-height: 1.55;
    }
    .choices {
      display: grid;
      gap: 10px;
    }
    .choice {
      width: 100%;
      padding: 14px 15px;
      border: 2px solid #dce3ea;
      border-radius: 14px;
      background: #fcfdff;
      text-align: left;
      font-size: 18px;
      cursor: pointer;
    }
    .choice:hover:not(:disabled) {
      background: #f1f5fa;
    }
    .choice:disabled { cursor: default; }
    .choice.correct {
      border-color: #5dbb7a;
      background: #def7e6;
      color: #176536;
      font-weight: 700;
    }
    .choice.wrong {
      border-color: #e07373;
      background: #ffe3e3;
      color: #982626;
      font-weight: 700;
    }
    .result {
      min-height: 25px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: 700;
    }
    .explain {
      display: none;
      margin-top: 8px;
      padding: 11px 13px;
      background: #fff7dc;
      border-radius: 11px;
      font-size: 16px;
      line-height: 1.55;
    }
    .summary {
      margin-top: 24px;
      padding: 21px;
      background: #edf4fb;
      border-radius: 20px;
      font-size: 17px;
      line-height: 1.9;
    }
    .summary h3 {
      margin: 0 0 9px;
      font-size: 21px;
    }
    .final-message {
      display: none;
      margin-top: 18px;
      padding: 18px;
      background: #fff0f4;
      border-radius: 18px;
      text-align: center;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.6;
    }
    .reset {
      display: block;
      margin: 24px auto 0;
      padding: 13px 24px;
      border: 0;
      border-radius: 14px;
      background: #73859a;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    @media (max-width: 430px) {
      .hero h1 { font-size: 23px; }
      .question h2 { font-size: 19px; }
      .choice { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>🌥️ 흐리다·컴컴하다<br>캄캄하다·어둑어둑하다</h1>
      <p>상황을 읽고 가장 잘 어울리는 말을 골라 보세요!</p>
    </section>

    <div class="progress">
      맞힌 문제 <span id="score">0</span>개 · 푼 문제 <span id="done">0</span>/10
    </div>

    <div id="quiz"></div>
    <div id="finalMessage" class="final-message"></div>

    <section class="summary">
      <h3>🌱 한 번에 정리해요</h3>
      ☁️ <b>흐리다</b> : 구름이나 안개 때문에 햇빛이 약하고 날씨가 맑지 않아요.<br>
      🌆 <b>어둑어둑하다</b> : 해가 지거나 동이 트면서 조금 어두운 상태예요.<br>
      🔦 <b>컴컴하다</b> : 빛이 거의 없어 앞이 잘 보이지 않아요.<br>
      🌑 <b>캄캄하다</b> : 매우 어두워 아무것도 보이지 않을 정도예요.
    </section>

    <button class="reset" onclick="resetQuiz()">처음부터 다시 풀기</button>
  </main>

  <script>
    const questions = [
      {
        q: "하늘에 구름이 많이 껴 햇빛이 잘 비치지 않았어요.",
        choices: ["흐리다", "컴컴하다", "캄캄하다", "어둑어둑하다"],
        answer: 0,
        explanation: "구름 때문에 햇빛이 약하고 날씨가 맑지 않을 때는 ‘흐리다’가 알맞아요."
      },
      {
        q: "해가 막 지기 시작해 주변이 조금씩 어두워졌어요.",
        choices: ["흐리다", "컴컴하다", "캄캄하다", "어둑어둑하다"],
        answer: 3,
        explanation: "완전히 어둡기 전, 주변이 조금 어두워진 상태는 ‘어둑어둑하다’예요."
      },
      {
        q: "창고 안에 전등이 꺼져 앞이 잘 보이지 않았어요.",
        choices: ["흐리다", "컴컴하다", "캄캄하다", "어둑어둑하다"],
        answer: 1,
        explanation: "빛이 거의 없어 앞이 잘 보이지 않을 때는 ‘컴컴하다’라고 해요."
      },
      {
        q: "불이 모두 꺼져 아무것도 보이지 않았어요.",
        choices: ["흐리다", "컴컴하다", "캄캄하다", "어둑어둑하다"],
        answer: 2,
        explanation: "아무것도 보이지 않을 정도로 매우 어두우면 ‘캄캄하다’가 알맞아요."
      },
      {
        q: "비가 오기 전이라 햇빛이 약하고 하늘색이 탁해졌어요.",
        choices: ["컴컴하다", "흐리다", "어둑어둑하다", "캄캄하다"],
        answer: 1,
        explanation: "날씨가 맑지 않고 햇빛이 약한 상태는 ‘흐리다’예요."
      },
      {
        q: "저녁이 되어 운동장이 조금씩 어두워졌어요.",
        choices: ["캄캄하다", "컴컴하다", "어둑어둑하다", "흐리다"],
        answer: 2,
        explanation: "저녁 무렵처럼 완전히 어둡지 않은 상태에는 ‘어둑어둑하다’가 어울려요."
      },
      {
        q: "지하실은 불을 켜지 않아 앞이 잘 보이지 않았어요.",
        choices: ["컴컴하다", "어둑어둑하다", "흐리다", "캄캄하다"],
        answer: 0,
        explanation: "빛이 부족해 앞이 잘 보이지 않는 곳은 ‘컴컴하다’고 해요."
      },
      {
        q: "깊은 밤 산속은 손을 뻗어도 보이지 않을 만큼 어두웠어요.",
        choices: ["어둑어둑하다", "흐리다", "컴컴하다", "캄캄하다"],
        answer: 3,
        explanation: "손앞도 보이지 않을 만큼 매우 어두운 상태는 ‘캄캄하다’예요."
      },
      {
        q: "구름 때문에 해가 잘 보이지 않았어요.",
        choices: ["어둑어둑하다", "캄캄하다", "흐리다", "컴컴하다"],
        answer: 2,
        explanation: "구름이 끼어 해가 잘 보이지 않는 날씨는 ‘흐리다’예요."
      },
      {
        q: "노을이 사라지고 마을이 조금 어두워졌어요.",
        choices: ["컴컴하다", "어둑어둑하다", "캄캄하다", "흐리다"],
        answer: 1,
        explanation: "완전히 밤이 되기 전에 조금 어두워진 상태는 ‘어둑어둑하다’예요."
      }
    ];

    let score = 0;
    let done = 0;
    const answered = Array(questions.length).fill(false);

    function renderQuiz() {
      const quiz = document.getElementById("quiz");
      quiz.innerHTML = "";

      questions.forEach((item, questionIndex) => {
        const section = document.createElement("section");
        section.className = "question";

        const title = document.createElement("h2");
        title.textContent = `${questionIndex + 1}. ${item.q}`;
        section.appendChild(title);

        const choices = document.createElement("div");
        choices.className = "choices";

        item.choices.forEach((choiceText, choiceIndex) => {
          const button = document.createElement("button");
          button.className = "choice";
          button.textContent = `${choiceIndex + 1}. ${choiceText}`;
          button.addEventListener("click", () => checkAnswer(
            questionIndex, choiceIndex, button, section
          ));
          choices.appendChild(button);
        });

        const result = document.createElement("div");
        result.className = "result";

        const explain = document.createElement("div");
        explain.className = "explain";

        section.appendChild(choices);
        section.appendChild(result);
        section.appendChild(explain);
        quiz.appendChild(section);
      });
    }

    function checkAnswer(questionIndex, choiceIndex, selectedButton, section) {
      if (answered[questionIndex]) return;

      answered[questionIndex] = true;
      done += 1;

      const item = questions[questionIndex];
      const buttons = section.querySelectorAll(".choice");
      const result = section.querySelector(".result");
      const explain = section.querySelector(".explain");

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === item.answer) button.classList.add("correct");
      });

      if (choiceIndex === item.answer) {
        score += 1;
        result.textContent = "⭕ 정답이에요!";
      } else {
        selectedButton.classList.add("wrong");
        result.textContent = `❌ 정답은 ‘${item.choices[item.answer]}’예요.`;
      }

      explain.textContent = `💡 ${item.explanation}`;
      explain.style.display = "block";

      document.getElementById("score").textContent = score;
      document.getElementById("done").textContent = done;

      if (done === questions.length) showFinalMessage();
    }

    function showFinalMessage() {
      const box = document.getElementById("finalMessage");

      if (score === 10) {
        box.textContent = "🎉 10문제를 모두 맞혔어요! 밝기와 날씨의 차이를 정확히 알고 있네요.";
      } else if (score >= 7) {
        box.textContent = `👏 ${score}문제를 맞혔어요! 헷갈린 문제만 다시 살펴보세요.`;
      } else {
        box.textContent = `🌱 ${score}문제를 맞혔어요. 아래 정리를 읽고 다시 도전해 보세요!`;
      }

      box.style.display = "block";
      box.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetQuiz() {
      score = 0;
      done = 0;
      answered.fill(false);
      document.getElementById("score").textContent = "0";
      document.getElementById("done").textContent = "0";
      document.getElementById("finalMessage").style.display = "none";
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    renderQuiz();
  </script>
</body>
</html>
