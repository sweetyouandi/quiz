<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>꿀꺽꿀꺽·벌컥벌컥·홀짝홀짝 퀴즈</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
      background: #fffaf3;
      color: #333;
    }

    .wrap {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 22px 15px 45px;
    }

    .hero {
      padding: 27px 18px;
      margin-bottom: 20px;
      text-align: center;
      background: linear-gradient(135deg, #dff5ff, #fff0c9);
      border-radius: 24px;
      box-shadow: 0 7px 20px rgba(0, 0, 0, 0.08);
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 27px;
      line-height: 1.45;
    }

    .hero p {
      margin: 0;
      font-size: 17px;
      line-height: 1.6;
    }

    .progress {
      position: sticky;
      top: 8px;
      z-index: 10;
      margin-bottom: 16px;
      padding: 12px 16px;
      text-align: center;
      color: white;
      background: #3f4b52;
      border-radius: 15px;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .question {
      margin-bottom: 16px;
      padding: 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.07);
    }

    .question h2 {
      margin: 0 0 14px;
      font-size: 20px;
      line-height: 1.55;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      width: 100%;
      padding: 14px 15px;
      border: 2px solid #dce7ed;
      border-radius: 14px;
      background: #fcfeff;
      text-align: left;
      font-size: 18px;
      cursor: pointer;
      transition: 0.15s;
    }

    .choice:hover:not(:disabled) {
      background: #eef9ff;
      transform: translateY(-1px);
    }

    .choice:disabled {
      cursor: default;
    }

    .choice.correct {
      border-color: #5dbb7a;
      background: #def7e6;
      color: #176536;
      font-weight: 700;
    }

    .choice.wrong {
      border-color: #e07373;
      background: #ffe3e3;
      color: #982626;
      font-weight: 700;
    }

    .result {
      min-height: 25px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
    }

    .explain {
      display: none;
      margin-top: 8px;
      padding: 11px 13px;
      background: #fff8df;
      border-radius: 11px;
      font-size: 16px;
      line-height: 1.55;
      font-weight: 400;
    }

    .summary {
      margin-top: 24px;
      padding: 21px;
      background: #eef7ff;
      border-radius: 20px;
      font-size: 17px;
      line-height: 1.85;
    }

    .summary h3 {
      margin: 0 0 9px;
      font-size: 21px;
    }

    .reset {
      display: block;
      margin: 24px auto 0;
      padding: 13px 24px;
      border: 0;
      border-radius: 14px;
      background: #ff9860;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .final-message {
      display: none;
      margin-top: 18px;
      padding: 18px;
      background: #fff0f5;
      border-radius: 18px;
      text-align: center;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.6;
    }

    @media (max-width: 430px) {
      .hero h1 { font-size: 24px; }
      .question h2 { font-size: 19px; }
      .choice { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>🥤 꿀꺽꿀꺽·벌컥벌컥<br>홀짝홀짝</h1>
      <p>마시는 모습을 떠올리며 가장 잘 어울리는 말을 골라 보세요!</p>
    </section>

    <div class="progress">
      맞힌 문제 <span id="score">0</span>개 · 푼 문제 <span id="done">0</span>/12
    </div>

    <div id="quiz"></div>

    <div id="finalMessage" class="final-message"></div>

    <section class="summary">
      <h3>🌱 한 번에 정리해요</h3>
      💧 <b>꿀꺽꿀꺽</b> : 물이나 음식을 목으로 자꾸 삼키는 소리나 모습<br>
      🥤 <b>벌컥벌컥</b> : 많은 양의 물을 급하게 잇따라 마시는 모습<br>
      ☕ <b>홀짝홀짝</b> : 음료를 한 번에 조금씩 천천히 마시는 모습
    </section>

    <button class="reset" onclick="resetQuiz()">처음부터 다시 풀기</button>
  </main>

  <script>
    const questions = [
      {
        q: "민이가 알약을 먹고 물과 함께 목으로 여러 번 삼켰어요.",
        choices: ["꿀꺽꿀꺽", "벌컥벌컥", "홀짝홀짝"],
        answer: 0,
        explanation: "목으로 물이나 음식을 잇따라 삼키는 모습에는 ‘꿀꺽꿀꺽’이 잘 어울려요."
      },
      {
        q: "운동을 마친 아빠가 목이 말라 큰 컵의 물을 아주 빠르게 마셨어요.",
        choices: ["홀짝홀짝", "벌컥벌컥", "꿀꺽꿀꺽"],
        answer: 1,
        explanation: "많은 양을 급하게 마시는 모습에는 ‘벌컥벌컥’이 알맞아요."
      },
      {
        q: "민이가 뜨거운 코코아를 입에 데지 않도록 조금씩 천천히 마셨어요.",
        choices: ["벌컥벌컥", "꿀꺽꿀꺽", "홀짝홀짝"],
        answer: 2,
        explanation: "음료를 조금씩 천천히 마실 때는 ‘홀짝홀짝’이라고 해요."
      },
      {
        q: "강아지가 물그릇의 물을 목으로 연달아 삼켰어요.",
        choices: ["꿀꺽꿀꺽", "홀짝홀짝", "벌컥벌컥"],
        answer: 0,
        explanation: "물을 목으로 계속 삼키는 소리와 모습은 ‘꿀꺽꿀꺽’으로 표현할 수 있어요."
      },
      {
        q: "더운 날 밖에서 뛰어온 형이 생수 한 병을 급하게 들이켰어요.",
        choices: ["꿀꺽꿀꺽", "벌컥벌컥", "홀짝홀짝"],
        answer: 1,
        explanation: "물을 많이, 빠르게 들이켜는 모습은 ‘벌컥벌컥’이에요."
      },
      {
        q: "할머니가 따뜻한 차를 작은 잔에 따라 조금씩 음미하며 마셨어요.",
        choices: ["벌컥벌컥", "꿀꺽꿀꺽", "홀짝홀짝"],
        answer: 2,
        explanation: "차처럼 뜨거운 음료를 한 모금씩 천천히 마실 때는 ‘홀짝홀짝’이 어울려요."
      },
      {
        q: "아기가 우유를 마신 뒤 입안에 남은 우유를 목으로 계속 삼켰어요.",
        choices: ["꿀꺽꿀꺽", "홀짝홀짝", "벌컥벌컥"],
        answer: 0,
        explanation: "입안의 음료를 목으로 연달아 넘기는 모습은 ‘꿀꺽꿀꺽’이에요."
      },
      {
        q: "달리기를 끝낸 선수가 물병을 들고 쉬지 않고 빠르게 마셨어요.",
        choices: ["홀짝홀짝", "벌컥벌컥", "꿀꺽꿀꺽"],
        answer: 1,
        explanation: "목이 말라 많은 양을 빠르게 마시는 모습은 ‘벌컥벌컥’이라고 해요."
      },
      {
        q: "엄마는 향긋한 커피를 작은 모금으로 천천히 마셨어요.",
        choices: ["홀짝홀짝", "꿀꺽꿀꺽", "벌컥벌컥"],
        answer: 0,
        explanation: "작은 모금으로 조금씩 마시는 모습에는 ‘홀짝홀짝’이 알맞아요."
      },
      {
        q: "민이가 목에 걸린 떡을 물과 함께 조심스럽게 여러 번 삼켰어요.",
        choices: ["벌컥벌컥", "홀짝홀짝", "꿀꺽꿀꺽"],
        answer: 2,
        explanation: "물이나 음식을 목으로 계속 넘기는 모습은 ‘꿀꺽꿀꺽’이에요."
      },
      {
        q: "준이가 시원한 보리차를 컵째 들고 한꺼번에 빠르게 마셨어요.",
        choices: ["홀짝홀짝", "꿀꺽꿀꺽", "벌컥벌컥"],
        answer: 2,
        explanation: "컵의 음료를 한꺼번에 급하게 마시는 모습에는 ‘벌컥벌컥’이 잘 어울려요."
      },
      {
        q: "민이가 빨대로 주스를 한 모금씩 쉬어 가며 마셨어요.",
        choices: ["꿀꺽꿀꺽", "홀짝홀짝", "벌컥벌컥"],
        answer: 1,
        explanation: "한 모금씩 쉬어 가며 조금씩 마시는 모습은 ‘홀짝홀짝’이에요."
      }
    ];

    let score = 0;
    let done = 0;
    const answered = Array(questions.length).fill(false);

    function renderQuiz() {
      const quiz = document.getElementById("quiz");
      quiz.innerHTML = "";

      questions.forEach((item, questionIndex) => {
        const section = document.createElement("section");
        section.className = "question";

        const title = document.createElement("h2");
        title.textContent = `${questionIndex + 1}. ${item.q}`;
        section.appendChild(title);

        const choices = document.createElement("div");
        choices.className = "choices";

        item.choices.forEach((choiceText, choiceIndex) => {
          const button = document.createElement("button");
          button.className = "choice";
          button.textContent = `${choiceIndex + 1}. ${choiceText}`;
          button.addEventListener("click", () => {
            checkAnswer(questionIndex, choiceIndex, button, section);
          });
          choices.appendChild(button);
        });

        const result = document.createElement("div");
        result.className = "result";

        const explain = document.createElement("div");
        explain.className = "explain";

        section.appendChild(choices);
        section.appendChild(result);
        section.appendChild(explain);
        quiz.appendChild(section);
      });
    }

    function checkAnswer(questionIndex, choiceIndex, selectedButton, section) {
      if (answered[questionIndex]) return;

      answered[questionIndex] = true;
      done += 1;

      const item = questions[questionIndex];
      const buttons = section.querySelectorAll(".choice");
      const result = section.querySelector(".result");
      const explain = section.querySelector(".explain");

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === item.answer) {
          button.classList.add("correct");
        }
      });

      if (choiceIndex === item.answer) {
        score += 1;
        result.textContent = "⭕ 정답이에요!";
      } else {
        selectedButton.classList.add("wrong");
        result.textContent = `❌ 정답은 ‘${item.choices[item.answer]}’이에요.`;
      }

      explain.textContent = `💡 ${item.explanation}`;
      explain.style.display = "block";

      document.getElementById("score").textContent = score;
      document.getElementById("done").textContent = done;

      if (done === questions.length) showFinalMessage();
    }

    function showFinalMessage() {
      const finalMessage = document.getElementById("finalMessage");
      let message = "";

      if (score === 12) {
        message = "🎉 12문제를 모두 맞혔어요! 마시는 모습의 차이를 정확히 알고 있네요.";
      } else if (score >= 9) {
        message = `👏 ${score}문제를 맞혔어요! 헷갈린 문제만 다시 살펴보세요.`;
      } else {
        message = `🌱 ${score}문제를 맞혔어요. 아래 정리를 읽고 다시 도전해 보세요!`;
      }

      finalMessage.textContent = message;
      finalMessage.style.display = "block";
      finalMessage.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetQuiz() {
      score = 0;
      done = 0;
      answered.fill(false);
      document.getElementById("score").textContent = "0";
      document.getElementById("done").textContent = "0";
      document.getElementById("finalMessage").style.display = "none";
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    renderQuiz();
  </script>
</body>
</html>
