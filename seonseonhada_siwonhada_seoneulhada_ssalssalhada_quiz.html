
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선선하다·시원하다·서늘하다·쌀쌀하다 퀴즈</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;background:#f6fbfc;color:#333}
    .wrap{width:min(720px,100%);margin:0 auto;padding:22px 15px 45px}
    .hero{padding:27px 18px;margin-bottom:20px;text-align:center;background:linear-gradient(135deg,#dff4f6,#e9f0ff);border-radius:24px;box-shadow:0 7px 20px rgba(0,0,0,.08)}
    .hero h1{margin:0 0 10px;font-size:26px;line-height:1.45}
    .hero p{margin:0;font-size:17px;line-height:1.6}
    .progress{position:sticky;top:8px;z-index:10;margin-bottom:16px;padding:12px 16px;text-align:center;color:#fff;background:#405b63;border-radius:15px;font-size:17px;font-weight:700;box-shadow:0 5px 15px rgba(0,0,0,.15)}
    .question{margin-bottom:16px;padding:20px;background:#fff;border-radius:20px;box-shadow:0 5px 16px rgba(0,0,0,.07)}
    .question h2{margin:0 0 14px;font-size:20px;line-height:1.55}
    .choices{display:grid;gap:10px}
    .choice{width:100%;padding:14px 15px;border:2px solid #dbe8eb;border-radius:14px;background:#fcfeff;text-align:left;font-size:18px;cursor:pointer;transition:.15s}
    .choice:hover:not(:disabled){background:#edf8fa;transform:translateY(-1px)}
    .choice:disabled{cursor:default}
    .choice.correct{border-color:#5dbb7a;background:#def7e6;color:#176536;font-weight:700}
    .choice.wrong{border-color:#e07373;background:#ffe3e3;color:#982626;font-weight:700}
    .result{min-height:25px;margin-top:12px;font-size:17px;font-weight:700;line-height:1.5}
    .explain{display:none;margin-top:8px;padding:11px 13px;background:#fff8df;border-radius:11px;font-size:16px;line-height:1.55}
    .summary{margin-top:24px;padding:21px;background:#eaf7fa;border-radius:20px;font-size:17px;line-height:1.9}
    .summary h3{margin:0 0 9px;font-size:21px}
    .final-message{display:none;margin-top:18px;padding:18px;background:#fff0f4;border-radius:18px;text-align:center;font-size:19px;font-weight:700;line-height:1.6}
    .reset{display:block;margin:24px auto 0;padding:13px 24px;border:0;border-radius:14px;background:#5d8f99;color:white;font-size:17px;font-weight:700;cursor:pointer}
    @media(max-width:430px){.hero h1{font-size:22px}.question h2{font-size:19px}.choice{font-size:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>🍃 선선하다·시원하다<br>서늘하다·쌀쌀하다</h1>
      <p>공기와 날씨의 느낌을 떠올리며 알맞은 말을 골라 보세요!</p>
    </section>

    <div class="progress">
      맞힌 문제 <span id="score">0</span>개 · 푼 문제 <span id="done">0</span>/12
    </div>

    <div id="quiz"></div>
    <div id="finalMessage" class="final-message"></div>

    <section class="summary">
      <h3>🌱 한 번에 정리해요</h3>
      🍃 <b>선선하다</b> : 덥지도 춥지도 않고 기분 좋게 약간 차요.<br>
      🧊 <b>시원하다</b> : 더위가 가시고 상쾌한 느낌이에요.<br>
      🌫️ <b>서늘하다</b> : 공기나 공간에 약간 찬 기운이 돌아요.<br>
      🧥 <b>쌀쌀하다</b> : 날씨가 제법 차가워 몸이 움츠러들어요.
    </section>

    <button class="reset" onclick="resetQuiz()">처음부터 다시 풀기</button>
  </main>

  <script>
    const questions = [{"q": "초가을 저녁에 바람이 살짝 불어 덥지도 춥지도 않았어요.", "choices": ["선선하다", "시원하다", "서늘하다", "쌀쌀하다"], "answer": 0, "explanation": "덥지 않고 기분 좋게 약간 찬 공기가 느껴질 때는 ‘선선하다’가 알맞아요."}, {"q": "더운 날 찬물을 마시니 몸의 더위가 가셨어요.", "choices": ["선선하다", "시원하다", "서늘하다", "쌀쌀하다"], "answer": 1, "explanation": "더위가 가시고 상쾌해지는 느낌은 ‘시원하다’라고 해요."}, {"q": "햇빛이 들지 않는 지하실에 들어가니 약간 찬 기운이 느껴졌어요.", "choices": ["선선하다", "시원하다", "서늘하다", "쌀쌀하다"], "answer": 2, "explanation": "공간이나 공기에 약간 찬 기운이 느껴질 때는 ‘서늘하다’가 잘 어울려요."}, {"q": "늦가을 아침에 얇은 옷만 입고 나갔더니 몸이 조금 떨렸어요.", "choices": ["선선하다", "시원하다", "서늘하다", "쌀쌀하다"], "answer": 3, "explanation": "날씨가 제법 차가워 몸이 움츠러들 정도면 ‘쌀쌀하다’가 알맞아요."}, {"q": "밤이 되자 바람이 부드럽게 불어 산책하기 좋았어요.", "choices": ["선선하다", "서늘하다", "쌀쌀하다", "시원하다"], "answer": 0, "explanation": "덥지도 춥지도 않고 기분 좋은 바람이 부는 날씨는 ‘선선하다’예요."}, {"q": "에어컨을 켜니 더웠던 방 안이 금세 상쾌해졌어요.", "choices": ["서늘하다", "시원하다", "선선하다", "쌀쌀하다"], "answer": 1, "explanation": "더위가 가시고 상쾌해지면 ‘시원하다’라고 해요."}, {"q": "해가 지고 숲속에 들어가니 차분한 찬 기운이 감돌았어요.", "choices": ["쌀쌀하다", "선선하다", "서늘하다", "시원하다"], "answer": 2, "explanation": "숲이나 그늘에서 느껴지는 약간 찬 기운은 ‘서늘하다’가 잘 어울려요."}, {"q": "비가 온 뒤 기온이 떨어져 겉옷이 없으면 추울 정도였어요.", "choices": ["시원하다", "서늘하다", "선선하다", "쌀쌀하다"], "answer": 3, "explanation": "겉옷이 필요할 만큼 날씨가 제법 차면 ‘쌀쌀하다’예요."}, {"q": "여름이 끝날 무렵 아침 공기가 기분 좋게 가벼웠어요.", "choices": ["선선하다", "쌀쌀하다", "시원하다", "서늘하다"], "answer": 0, "explanation": "초가을처럼 덥지 않고 기분 좋은 공기는 ‘선선하다’라고 해요."}, {"q": "운동을 마친 뒤 부채질을 하니 땀이 식었어요.", "choices": ["쌀쌀하다", "시원하다", "서늘하다", "선선하다"], "answer": 1, "explanation": "더위나 땀이 가시며 상쾌해지는 느낌은 ‘시원하다’예요."}, {"q": "동굴 안에 들어가자 햇볕이 없어 찬 공기가 느껴졌어요.", "choices": ["시원하다", "쌀쌀하다", "서늘하다", "선선하다"], "answer": 2, "explanation": "동굴이나 그늘처럼 약간 찬 기운이 도는 곳은 ‘서늘하다’고 해요."}, {"q": "초겨울 저녁 바람이 차가워 목도리를 하고 싶었어요.", "choices": ["서늘하다", "선선하다", "시원하다", "쌀쌀하다"], "answer": 3, "explanation": "옷을 더 챙겨 입고 싶을 만큼 찬 날씨는 ‘쌀쌀하다’가 알맞아요."}];
    let score = 0;
    let done = 0;
    const answered = Array(questions.length).fill(false);

    function renderQuiz(){
      const quiz=document.getElementById("quiz");
      quiz.innerHTML="";
      questions.forEach((item,qi)=>{
        const section=document.createElement("section");
        section.className="question";
        const title=document.createElement("h2");
        title.textContent=`${qi+1}. ${item.q}`;
        section.appendChild(title);

        const choices=document.createElement("div");
        choices.className="choices";
        item.choices.forEach((text,ci)=>{
          const button=document.createElement("button");
          button.className="choice";
          button.textContent=`${ci+1}. ${text}`;
          button.addEventListener("click",()=>checkAnswer(qi,ci,button,section));
          choices.appendChild(button);
        });

        const result=document.createElement("div");
        result.className="result";
        const explain=document.createElement("div");
        explain.className="explain";

        section.appendChild(choices);
        section.appendChild(result);
        section.appendChild(explain);
        quiz.appendChild(section);
      });
    }

    function checkAnswer(qi,ci,selected,section){
      if(answered[qi]) return;
      answered[qi]=true;
      done++;

      const item=questions[qi];
      const buttons=section.querySelectorAll(".choice");
      const result=section.querySelector(".result");
      const explain=section.querySelector(".explain");

      buttons.forEach((button,index)=>{
        button.disabled=true;
        if(index===item.answer) button.classList.add("correct");
      });

      if(ci===item.answer){
        score++;
        result.textContent="⭕ 정답이에요!";
      }else{
        selected.classList.add("wrong");
        result.textContent=`❌ 정답은 ‘${item.choices[item.answer]}’예요.`;
      }

      explain.textContent=`💡 ${item.explanation}`;
      explain.style.display="block";
      document.getElementById("score").textContent=score;
      document.getElementById("done").textContent=done;

      if(done===questions.length) showFinalMessage();
    }

    function showFinalMessage(){
      const box=document.getElementById("finalMessage");
      if(score===12){
        box.textContent="🎉 12문제를 모두 맞혔어요! 네 가지 차가운 느낌의 차이를 정확히 알고 있네요.";
      }else if(score>=9){
        box.textContent=`👏 ${score}문제를 맞혔어요! 헷갈린 문제만 다시 살펴보세요.`;
      }else{
        box.textContent=`🌱 ${score}문제를 맞혔어요. 아래 정리를 읽고 다시 도전해 보세요!`;
      }
      box.style.display="block";
      box.scrollIntoView({behavior:"smooth",block:"center"});
    }

    function resetQuiz(){
      score=0;
      done=0;
      answered.fill(false);
      document.getElementById("score").textContent="0";
      document.getElementById("done").textContent="0";
      document.getElementById("finalMessage").style.display="none";
      renderQuiz();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    renderQuiz();
  </script>
</body>
</html>
