<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쨍그랑·달그락·덜컹 퀴즈</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #fffaf2;
      color: #333;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .hero {
      background: linear-gradient(135deg, #ffe7b8, #ffd7dc);
      border-radius: 24px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      margin-bottom: 22px;
    }
    .hero h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }
    .hero p {
      margin: 0;
      font-size: 17px;
      line-height: 1.6;
    }
    .question {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 5px 16px rgba(0,0,0,0.07);
    }
    .question h2 {
      font-size: 20px;
      margin: 0 0 14px;
      line-height: 1.5;
    }
    .choices {
      display: grid;
      gap: 10px;
    }
    button.choice {
      width: 100%;
      border: 2px solid #f1d3a8;
      background: #fffdf9;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      text-align: left;
    }
    button.choice:hover {
      background: #fff4df;
    }
    button.choice.correct {
      background: #dff7e6;
      border-color: #5fbf7f;
      color: #176536;
      font-weight: 700;
    }
    button.choice.wrong {
      background: #ffe2e2;
      border-color: #e06a6a;
      color: #9b2222;
      font-weight: 700;
    }
    .result {
      margin-top: 12px;
      font-size: 17px;
      font-weight: 700;
      min-height: 24px;
    }
    .score-box {
      position: sticky;
      bottom: 12px;
      background: #333;
      color: #fff;
      border-radius: 18px;
      padding: 14px 18px;
      text-align: center;
      font-size: 18px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      margin-top: 24px;
    }
    .summary {
      background: #eef8ff;
      border-radius: 20px;
      padding: 20px;
      margin-top: 24px;
      line-height: 1.8;
      font-size: 17px;
    }
    .summary strong {
      display: block;
      margin-bottom: 6px;
      font-size: 20px;
    }
    .reset {
      display: block;
      margin: 24px auto 0;
      border: none;
      border-radius: 14px;
      padding: 13px 22px;
      background: #ff9f68;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>🔔 쨍그랑·달그락·덜컹</h1>
      <p>문장을 읽고 가장 잘 어울리는 소리를 골라 보세요!</p>
    </section>

    <div id="quiz"></div>

    <section class="summary">
      <strong>🌱 한 번에 정리해요</strong>
      🥛 <b>쨍그랑</b> : 유리나 접시가 깨지며 나는 큰 소리<br>
      🥄 <b>달그락</b> : 딱딱한 물건끼리 가볍게 부딪히는 소리<br>
      🚗 <b>덜컹</b> : 차나 문, 서랍 등이 크게 흔들리거나 걸릴 때 나는 소리
    </section>

    <button class="reset" onclick="resetQuiz()">다시 풀기</button>

    <div class="score-box">
      맞힌 문제 <span id="score">0</span> / 10
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "컵을 떨어뜨렸더니 산산조각이 났어요.",
        choices: ["달그락", "덜컹", "쨍그랑"],
        answer: 2
      },
      {
        q: "자동차가 방지턱을 넘을 때 몸이 크게 흔들렸어요.",
        choices: ["덜컹", "쨍그랑", "달그락"],
        answer: 0
      },
      {
        q: "숟가락과 그릇이 부딪혀 작은 소리가 났어요.",
        choices: ["쨍그랑", "달그락", "덜컹"],
        answer: 1
      },
      {
        q: "유리창이 깨지며 큰 소리가 났어요.",
        choices: ["달그락", "쨍그랑", "덜컹"],
        answer: 1
      },
      {
        q: "서랍을 급하게 닫았더니 걸리면서 흔들렸어요.",
        choices: ["달그락", "쨍그랑", "덜컹"],
        answer: 2
      },
      {
        q: "가방 안에서 열쇠와 동전이 서로 부딪혔어요.",
        choices: ["달그락", "덜컹", "쨍그랑"],
        answer: 0
      },
      {
        q: "접시를 놓치자 바닥에서 깨지는 소리가 났어요.",
        choices: ["달그락", "쨍그랑", "덜컹"],
        answer: 1
      },
      {
        q: "엘리베이터가 멈출 때 살짝 흔들렸어요.",
        choices: ["쨍그랑", "덜컹", "달그락"],
        answer: 1
      },
      {
        q: "찬장 문을 열자 그릇들이 서로 살짝 부딪혔어요.",
        choices: ["덜컹", "달그락", "쨍그랑"],
        answer: 1
      },
      {
        q: "유리병이 바닥에 떨어져 산산이 깨졌어요.",
        choices: ["쨍그랑", "달그락", "덜컹"],
        answer: 0
      }
    ];

    let score = 0;
    const answered = new Array(questions.length).fill(false);
    const quiz = document.getElementById("quiz");

    function renderQuiz() {
      quiz.innerHTML = "";
      questions.forEach((item, index) => {
        const box = document.createElement("section");
        box.className = "question";

        const title = document.createElement("h2");
        title.textContent = `${index + 1}. ${item.q}`;
        box.appendChild(title);

        const choices = document.createElement("div");
        choices.className = "choices";

        item.choices.forEach((choice, choiceIndex) => {
          const btn = document.createElement("button");
          btn.className = "choice";
          btn.textContent = `${choiceIndex + 1}. ${choice}`;
          btn.onclick = () => checkAnswer(index, choiceIndex, btn, box);
          choices.appendChild(btn);
        });

        const result = document.createElement("div");
        result.className = "result";

        box.appendChild(choices);
        box.appendChild(result);
        quiz.appendChild(box);
      });
    }

    function checkAnswer(questionIndex, choiceIndex, button, box) {
      if (answered[questionIndex]) return;

      answered[questionIndex] = true;
      const correctIndex = questions[questionIndex].answer;
      const buttons = box.querySelectorAll(".choice");
      const result = box.querySelector(".result");

      buttons.forEach((btn, index) => {
        btn.disabled = true;
        if (index === correctIndex) btn.classList.add("correct");
      });

      if (choiceIndex === correctIndex) {
        score++;
        result.textContent = "⭕ 정답이에요!";
      } else {
        button.classList.add("wrong");
        result.textContent = `❌ 정답은 '${questions[questionIndex].choices[correctIndex]}'이에요.`;
      }

      document.getElementById("score").textContent = score;
    }

    function resetQuiz() {
      score = 0;
      answered.fill(false);
      document.getElementById("score").textContent = "0";
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    renderQuiz();
  </script>
</body>
</html>
