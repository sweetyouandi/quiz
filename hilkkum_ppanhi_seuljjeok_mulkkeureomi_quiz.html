
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>힐끔힐끔·빤히·슬쩍·물끄러미 퀴즈</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;background:#f7fafc;color:#333}
    .wrap{width:min(720px,100%);margin:0 auto;padding:22px 15px 45px}
    .hero{padding:27px 18px;margin-bottom:20px;text-align:center;background:linear-gradient(135deg,#e2f0f6,#f3e9fb);border-radius:24px;box-shadow:0 7px 20px rgba(0,0,0,.08)}
    .hero h1{margin:0 0 10px;font-size:25px;line-height:1.45}
    .hero p{margin:0;font-size:17px;line-height:1.6}
    .progress{position:sticky;top:8px;z-index:10;margin-bottom:16px;padding:12px 16px;text-align:center;color:#fff;background:#4e6674;border-radius:15px;font-size:17px;font-weight:700;box-shadow:0 5px 15px rgba(0,0,0,.15)}
    .question{margin-bottom:16px;padding:20px;background:#fff;border-radius:20px;box-shadow:0 5px 16px rgba(0,0,0,.07)}
    .question h2{margin:0 0 14px;font-size:20px;line-height:1.55}
    .choices{display:grid;gap:10px}
    .choice{width:100%;padding:14px 15px;border:2px solid #dfe8ed;border-radius:14px;background:#fcfeff;text-align:left;font-size:18px;cursor:pointer;transition:.15s}
    .choice:hover:not(:disabled){background:#eef6fa;transform:translateY(-1px)}
    .choice:disabled{cursor:default}
    .choice.correct{border-color:#5dbb7a;background:#def7e6;color:#176536;font-weight:700}
    .choice.wrong{border-color:#e07373;background:#ffe3e3;color:#982626;font-weight:700}
    .result{min-height:25px;margin-top:12px;font-size:17px;font-weight:700;line-height:1.5}
    .explain{display:none;margin-top:8px;padding:11px 13px;background:#fff8df;border-radius:11px;font-size:16px;line-height:1.55}
    .summary{margin-top:24px;padding:21px;background:#edf5f8;border-radius:20px;font-size:17px;line-height:1.9}
    .summary h3{margin:0 0 9px;font-size:21px}
    .final-message{display:none;margin-top:18px;padding:18px;background:#fff0f4;border-radius:18px;text-align:center;font-size:19px;font-weight:700;line-height:1.6}
    .reset{display:block;margin:24px auto 0;padding:13px 24px;border:0;border-radius:14px;background:#698a9c;color:white;font-size:17px;font-weight:700;cursor:pointer}
    @media(max-width:430px){.hero h1{font-size:21px}.question h2{font-size:19px}.choice{font-size:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>👀 힐끔힐끔·빤히<br>슬쩍·물끄러미</h1>
      <p>바라보는 모습과 행동을 떠올리며 알맞은 말을 골라 보세요!</p>
    </section>

    <div class="progress">
      맞힌 문제 <span id="score">0</span>개 · 푼 문제 <span id="done">0</span>/12
    </div>

    <div id="quiz"></div>
    <div id="finalMessage" class="final-message"></div>

    <section class="summary">
      <h3>🌱 한 번에 정리해요</h3>
      👀 <b>힐끔힐끔</b> : 남몰래 짧게 여러 번 바라보는 모습<br>
      🎯 <b>빤히</b> : 한곳을 눈을 떼지 않고 똑바로 바라보는 모습<br>
      🤫 <b>슬쩍</b> : 남이 눈치채지 못하게 살며시 보고 행동하는 모습<br>
      🌙 <b>물끄러미</b> : 생각에 잠긴 듯 말없이 오래 바라보는 모습
    </section>

    <button class="reset" onclick="resetQuiz()">처음부터 다시 풀기</button>
  </main>

  <script>
    const questions = [{"q": "민이는 들키지 않으려고 친구 쪽을 짧게 여러 번 바라보았어요.", "choices": ["힐끔힐끔", "빤히", "슬쩍", "물끄러미"], "answer": 0, "explanation": "남몰래 짧게 여러 번 바라보는 모습은 ‘힐끔힐끔’이에요."}, {"q": "아이는 신기한 장난감을 눈을 떼지 않고 오래 바라보았어요.", "choices": ["힐끔힐끔", "빤히", "슬쩍", "물끄러미"], "answer": 1, "explanation": "한곳을 눈을 떼지 않고 똑바로 바라보는 모습은 ‘빤히’예요."}, {"q": "엄마가 안 보는 사이 민이는 과자를 하나 집어 먹었어요.", "choices": ["힐끔힐끔", "빤히", "슬쩍", "물끄러미"], "answer": 2, "explanation": "남이 알아차리지 못하게 재빨리 행동하는 모습은 ‘슬쩍’이에요."}, {"q": "민이는 창밖의 비를 아무 말 없이 한동안 바라보았어요.", "choices": ["힐끔힐끔", "빤히", "슬쩍", "물끄러미"], "answer": 3, "explanation": "생각에 잠긴 듯 조용히 오래 바라보는 모습은 ‘물끄러미’예요."}, {"q": "준이는 선생님 눈치를 보며 옆 친구의 그림을 자꾸 바라보았어요.", "choices": ["힐끔힐끔", "물끄러미", "슬쩍", "빤히"], "answer": 0, "explanation": "눈치를 보며 짧게 여러 번 바라볼 때는 ‘힐끔힐끔’이 알맞아요."}, {"q": "강아지는 간식을 든 손을 가만히 똑바로 바라보았어요.", "choices": ["슬쩍", "빤히", "물끄러미", "힐끔힐끔"], "answer": 1, "explanation": "한 대상에서 시선을 떼지 않고 똑바로 보는 모습은 ‘빤히’예요."}, {"q": "민이는 친구에게 들키지 않게 쪽지를 책상 위에 놓았어요.", "choices": ["물끄러미", "힐끔힐끔", "슬쩍", "빤히"], "answer": 2, "explanation": "눈에 띄지 않게 살며시 행동하는 모습은 ‘슬쩍’이에요."}, {"q": "할머니는 오래된 사진을 보며 말없이 한참 바라보셨어요.", "choices": ["빤히", "슬쩍", "힐끔힐끔", "물끄러미"], "answer": 3, "explanation": "감정이나 생각에 잠겨 조용히 오래 바라보는 모습은 ‘물끄러미’예요."}, {"q": "민이는 발표 순서를 기다리며 시계를 자꾸 곁눈질했어요.", "choices": ["힐끔힐끔", "슬쩍", "빤히", "물끄러미"], "answer": 0, "explanation": "짧게 곁눈질하며 여러 번 바라보는 모습은 ‘힐끔힐끔’이에요."}, {"q": "아이는 낯선 사람의 얼굴을 궁금한 듯 똑바로 바라보았어요.", "choices": ["물끄러미", "빤히", "힐끔힐끔", "슬쩍"], "answer": 1, "explanation": "상대의 얼굴을 눈을 떼지 않고 똑바로 보는 모습은 ‘빤히’예요."}, {"q": "엄마가 바쁠 때 민이는 장난감을 조용히 제자리로 옮겨 놓았어요.", "choices": ["빤히", "물끄러미", "슬쩍", "힐끔힐끔"], "answer": 2, "explanation": "남이 눈치채지 않게 살며시 행동할 때는 ‘슬쩍’이라고 해요."}, {"q": "민이는 떠나는 버스를 보며 아무 말 없이 오래 서 있었어요.", "choices": ["슬쩍", "빤히", "힐끔힐끔", "물끄러미"], "answer": 3, "explanation": "말없이 생각에 잠긴 듯 오래 바라보는 모습은 ‘물끄러미’예요."}];
    let score = 0;
    let done = 0;
    const answered = Array(questions.length).fill(false);

    function renderQuiz(){
      const quiz=document.getElementById("quiz");
      quiz.innerHTML="";

      questions.forEach((item,qi)=>{
        const section=document.createElement("section");
        section.className="question";

        const title=document.createElement("h2");
        title.textContent=`${qi+1}. ${item.q}`;
        section.appendChild(title);

        const choices=document.createElement("div");
        choices.className="choices";

        item.choices.forEach((text,ci)=>{
          const button=document.createElement("button");
          button.className="choice";
          button.textContent=`${ci+1}. ${text}`;
          button.addEventListener("click",()=>checkAnswer(qi,ci,button,section));
          choices.appendChild(button);
        });

        const result=document.createElement("div");
        result.className="result";

        const explain=document.createElement("div");
        explain.className="explain";

        section.appendChild(choices);
        section.appendChild(result);
        section.appendChild(explain);
        quiz.appendChild(section);
      });
    }

    function checkAnswer(qi,ci,selected,section){
      if(answered[qi]) return;

      answered[qi]=true;
      done++;

      const item=questions[qi];
      const buttons=section.querySelectorAll(".choice");
      const result=section.querySelector(".result");
      const explain=section.querySelector(".explain");

      buttons.forEach((button,index)=>{
        button.disabled=true;
        if(index===item.answer) button.classList.add("correct");
      });

      if(ci===item.answer){
        score++;
        result.textContent="⭕ 정답이에요!";
      }else{
        selected.classList.add("wrong");
        result.textContent=`❌ 정답은 ‘${item.choices[item.answer]}’예요.`;
      }

      explain.textContent=`💡 ${item.explanation}`;
      explain.style.display="block";

      document.getElementById("score").textContent=score;
      document.getElementById("done").textContent=done;

      if(done===questions.length) showFinalMessage();
    }

    function showFinalMessage(){
      const box=document.getElementById("finalMessage");

      if(score===12){
        box.textContent="🎉 12문제를 모두 맞혔어요! 네 가지 바라보는 모습의 차이를 정확히 알고 있네요.";
      }else if(score>=9){
        box.textContent=`👏 ${score}문제를 맞혔어요! 헷갈린 문제만 다시 살펴보세요.`;
      }else{
        box.textContent=`🌱 ${score}문제를 맞혔어요. 아래 정리를 읽고 다시 도전해 보세요!`;
      }

      box.style.display="block";
      box.scrollIntoView({behavior:"smooth",block:"center"});
    }

    function resetQuiz(){
      score=0;
      done=0;
      answered.fill(false);

      document.getElementById("score").textContent="0";
      document.getElementById("done").textContent="0";
      document.getElementById("finalMessage").style.display="none";

      renderQuiz();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    renderQuiz();
  </script>
</body>
</html>
